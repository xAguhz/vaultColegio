<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torno TM300 en 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: escenario 3D a la izquierda, ficha técnica a la derecha (apilado en el celular). */
:root {
  --bg: #e9ecee;
  --panel: #fbfbfa;
  --stage: #dfe3e6;
  --ink: #1b2024;
  --muted: #5a6670;
  --line: #d3d8dc;
  --accent: #a85a12;
  --accent-ink: #ffffff;
  --accent-bg: #f6e6d2;
  --grid: #c3c9ce;
  --chip: #eef0f2;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171a; --panel: #1b1f23; --stage: #101315; --ink: #e5e8eb; --muted: #9ba5ae;
    --line: #2d3339; --accent: #f0a24a; --accent-ink: #1b1206; --accent-bg: #3a2a17;
    --grid: #262c32; --chip: #23292e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171a; --panel: #1b1f23; --stage: #101315; --ink: #e5e8eb; --muted: #9ba5ae;
  --line: #2d3339; --accent: #f0a24a; --accent-ink: #1b1206; --accent-bg: #3a2a17;
  --grid: #262c32; --chip: #23292e; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 390px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top" "stage panel";
}
.top {
  grid-area: top;
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.01em; margin: 0; line-height: 1.1; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 13px; }
.top .plate { margin-left: auto; font-family: var(--font-data); font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }

.stage { grid-area: stage; position: relative; background: var(--stage); min-height: 0; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-data); color: var(--muted); font-size: 13px; }
.tip {
  position: absolute; pointer-events: none; padding: 4px 8px; border-radius: 4px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  font-size: 12px; font-weight: 500; white-space: nowrap; transform: translate(12px, 12px);
}
.controls {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(6px);
}
.slider { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0; }
.slider label { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: 0.03em; text-transform: uppercase; }
.slider input { flex: 1; min-width: 0; accent-color: var(--accent); }
.slider output { font-family: var(--font-data); font-size: 12px; width: 6ch; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 6px 11px; font-size: 13px; font-weight: 500; line-height: 1.2;
}
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; }

.panel { grid-area: panel; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 12px; gap: 4px; }
.tab {
  border: 0; background: none; padding: 10px 10px 9px; font-family: var(--font-display); font-weight: 600;
  font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { overflow-y: auto; padding: 16px 18px 28px; min-height: 0; flex: 1; }

.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--chip);
  border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; font-weight: 500;
}
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
h2.name { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 10px 0 8px; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
p { margin: 0 0 10px; max-width: 65ch; }
.data { width: 100%; border-collapse: collapse; font-size: 13px; }
.data th, .data td { text-align: left; vertical-align: top; padding: 6px 0; border-bottom: 1px solid var(--line); }
.data th { font-weight: 500; color: var(--muted); width: 42%; padding-right: 10px; }
.data td { font-family: var(--font-data); font-size: 12.5px; }
ul.mant { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.ver { margin-top: 18px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.ver b { color: var(--ink); font-weight: 500; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.thumb { border: 1px solid var(--line); border-radius: 6px; padding: 4px; background: #fff; overflow: hidden; aspect-ratio: 3 / 4; max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
.list { display: grid; gap: 2px; }
.row {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 7px 8px; border-radius: 6px; font-size: 13.5px;
}
.row:hover { background: var(--chip); }
.row[aria-current="true"] { background: var(--accent-bg); }
.row .n { margin-left: auto; font-family: var(--font-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.group-h { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 4px; display: flex; align-items: center; gap: 8px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 10px; }
.note { font-size: 12.5px; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 9px 11px; margin-top: 14px; }
.lightbox { position: fixed; inset: 0; background: rgba(10, 12, 14, 0.82); z-index: 20; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.lightbox .lb-bar { display: flex; align-items: center; gap: 10px; color: #f1f3f4; padding-bottom: 8px; }
.lightbox .lb-bar span { flex: 1; font-size: 13px; min-width: 0; }
.lightbox .lb-img { flex: 1; overflow: auto; background: #fff; border-radius: 6px; }
.lightbox img { display: block; max-width: none; width: 100%; min-width: 600px; }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 62vh auto; grid-template-areas: "top" "stage" "panel"; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .pane { overflow: visible; }
  .top .plate { display: none; }
  .controls { left: 8px; right: 8px; bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <h1>Torno Femar TM300</h1>
    <span class="sub">Despiece 3D por conjuntos · manual C0632A</span>
    <span class="plate">S/N 831930 · 08/2008 · 1,5 kW · 166 mm entre centros</span>
  </header>

  <section class="stage" id="stage" aria-label="Modelo 3D del torno">
    <div class="loading" id="loading">Cargando el modelo…</div>
    <div class="tip" id="tip" hidden></div>
    <div class="controls">
      <div class="slider">
        <label for="explode">Despiece</label>
        <input id="explode" type="range" min="0" max="100" value="0" step="1">
        <output id="explode-out" for="explode">0 %</output>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btn-anim" type="button">Despiezar</button>
        <button class="btn" id="btn-color" type="button" aria-pressed="false">Color por conjunto</button>
        <button class="btn" id="btn-cut" type="button" aria-pressed="false">Corte</button>
        <button class="btn" id="btn-show" type="button" hidden>Mostrar todo</button>
        <button class="btn" id="btn-home" type="button">Vista inicial</button>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-ficha" aria-selected="true" aria-controls="pane-ficha" type="button">Ficha</button>
      <button class="tab" role="tab" id="tab-piezas" aria-selected="false" aria-controls="pane-piezas" type="button">Piezas</button>
    </div>
    <div class="pane" id="pane-ficha" role="tabpanel" aria-labelledby="tab-ficha"></div>
    <div class="pane" id="pane-piezas" role="tabpanel" aria-labelledby="tab-piezas" hidden>
      <input class="search" id="search" type="search" placeholder="Buscar pieza, código o conjunto" aria-label="Buscar pieza">
      <div id="plist"></div>
    </div>
  </aside>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-bar"><span id="lb-cap"></span><button class="btn" id="lb-close" type="button">Cerrar</button></div>
  <div class="lb-img"><img id="lb-img" alt=""></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const FICHAS = await fetch('fichas.json').then((r) => r.json());
const CONJ = FICHAS.conjuntos;
const ORDER = Object.keys(CONJ);

// ---------------------------------------------------------------- escena
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(-2, 4, 3);
scene.add(sun, new THREE.HemisphereLight(0xffffff, 0x666666, 0.6));

const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.62;
controls.minDistance = 0.35;
controls.maxDistance = 9;

const HOME_T = new THREE.Vector3(0.88, 0.82, 0);
const HOME_D = new THREE.Vector3(-0.55, 0.5, 1).normalize();
let grid;

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function applyTheme() {
  scene.background = new THREE.Color(cssVar('--stage'));
  if (grid) scene.remove(grid);
  grid = new THREE.GridHelper(6, 30, cssVar('--grid'), cssVar('--grid'));
  grid.position.set(0.9, 0, 0);
  scene.add(grid);
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

function homeView(animate = true, t = explodeT) {
  const dist = 3.7 * Math.max(1, 1.5 / camera.aspect) * (0.8 + 0.4 * t);
  flyTo(HOME_T.clone(), HOME_T.clone().addScaledVector(HOME_D, dist), animate);
}

// ---------------------------------------------------------------- vuelo de cámara
let fly = null;
function flyTo(target, pos, animate = true) {
  if (!animate || reduced) { controls.target.copy(target); camera.position.copy(pos); return; }
  fly = { t0: performance.now(), dur: 700, ft: controls.target.clone(), fp: camera.position.clone(), tt: target, tp: pos };
}

// ---------------------------------------------------------------- piezas
const parts = new Map();        // pid -> {obj, base, vec, conjunto, nombre, meshes}
const HL = new THREE.Color(cssVar('--accent') || '#f0a24a');
const cut = [new THREE.Plane(new THREE.Vector3(0, 0, -1), 0)];
let explodeT = 0, selected = null, hovered = null, colorMode = false, cutOn = false, isolated = null;
const hidden = new Set();

// El modelo viene como glTF con el binario embebido en base64 (las páginas
// publicadas no sirven .glb). La política de seguridad del visor bloquea que
// GLTFLoader lea ese data:, así que se decodifica acá y se arma un GLB en memoria.
async function loadModelBuffer(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const total = Number(res.headers.get('content-length')) || 0;
  let text;
  if (res.body && total) {
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      $('loading').textContent = `Cargando el modelo… ${Math.min(100, Math.round(100 * got / total))} %`;
    }
    text = new TextDecoder().decode(await new Blob(chunks).arrayBuffer());
  } else {
    text = await res.text();
  }
  const doc = JSON.parse(text);
  const uri = doc.buffers[0].uri;
  const b64 = atob(uri.slice(uri.indexOf(',') + 1));
  const bin = new Uint8Array(b64.length);
  for (let i = 0; i < b64.length; i++) bin[i] = b64.charCodeAt(i);
  delete doc.buffers[0].uri;
  doc.buffers[0].byteLength = bin.length;
  const json = new TextEncoder().encode(JSON.stringify(doc));
  const jl = Math.ceil(json.length / 4) * 4, bl = Math.ceil(bin.length / 4) * 4;
  const out = new Uint8Array(12 + 8 + jl + 8 + bl);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, out.length, true);
  dv.setUint32(12, jl, true); dv.setUint32(16, 0x4E4F534A, true);
  out.fill(0x20, 20, 20 + jl); out.set(json, 20);
  dv.setUint32(20 + jl, bl, true); dv.setUint32(24 + jl, 0x004E4942, true);
  out.set(bin, 28 + jl);
  return out.buffer;
}

function modelError(err) {
  console.error(err);
  $('loading').textContent = 'No se pudo cargar el modelo 3D. Recargá la página.';
}

const loader = new GLTFLoader();
loadModelBuffer('torno_tm300.json').then((buf) => loader.parse(buf, '', onModel, modelError)).catch(modelError);

function onModel(gltf) {
  scene.add(gltf.scene);
  gltf.scene.traverse((o) => {
    if (!o.userData || !o.userData.pid || parts.has(o.userData.pid)) return;
    const u = o.userData;
    const e = u.explode || [0, 0, 0];
    const meshes = [];
    o.traverse((m) => {
      if (!m.isMesh) return;
      m.material = m.material.clone();
      m.material.side = THREE.DoubleSide;
      m.userData.orig = m.material.color.clone();
      m.userData.part = u.pid;
      meshes.push(m);
    });
    parts.set(u.pid, {
      pid: u.pid, obj: o, nombre: u.nombre, conjunto: u.conjunto, meshes,
      base: o.position.clone(), vec: new THREE.Vector3(e[0], e[2], -e[1]),
    });
  });
  $('loading').hidden = true;
  buildList();
  homeView(false);
  const h = location.hash.slice(1).replace(/-/g, '_');
  if (h && parts.has(h)) select(h, { focus: true }); else renderOverview();
}

function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function setExplode(t) {
  explodeT = t;
  const k = ease(t);
  for (const p of parts.values()) p.obj.position.copy(p.base).addScaledVector(p.vec, k);
  $('explode').value = Math.round(t * 100);
  $('explode-out').textContent = `${Math.round(t * 100)} %`;
  $('btn-anim').textContent = t > 0.5 ? 'Armar' : 'Despiezar';
}
let anim = null;
$('explode').addEventListener('input', (e) => { anim = null; setExplode(e.target.value / 100); });
$('btn-anim').addEventListener('click', () => {
  const to = explodeT > 0.5 ? 0 : 1;
  if (!selected) homeView(true, to);
  if (reduced) { setExplode(to); return; }
  anim = { t0: performance.now(), from: explodeT, to, dur: 1400 };
});

function paint() {
  for (const p of parts.values()) {
    const ghost = isolated && !isolated.has(p.pid);
    const col = colorMode ? new THREE.Color(CONJ[p.conjunto]?.color || '#888') : null;
    for (const m of p.meshes) {
      const mat = m.material;
      mat.color.copy(col || m.userData.orig);
      if (colorMode) { mat.metalness = 0.1; mat.roughness = 0.6; } else { mat.metalness = m.userData.metal ?? (m.userData.metal = mat.metalness); mat.roughness = m.userData.rough ?? (m.userData.rough = mat.roughness); }
      mat.emissive.set(0x000000);
      mat.emissiveIntensity = 1;
      if (p.pid === selected) { mat.emissive.copy(HL); mat.emissiveIntensity = 0.55; }
      else if (p.pid === hovered) { mat.emissive.copy(HL); mat.emissiveIntensity = 0.22; }
      mat.transparent = !!ghost;
      mat.opacity = ghost ? 0.1 : 1;
      mat.depthWrite = !ghost;
      mat.clippingPlanes = cutOn ? cut : [];
      mat.needsUpdate = true;
    }
    p.obj.visible = !hidden.has(p.pid);
  }
  $('btn-show').hidden = !(hidden.size || isolated);
}
// guardar metal/rugosidad originales antes de cualquier cambio
function remember() { for (const p of parts.values()) for (const m of p.meshes) { m.userData.metal = m.material.metalness; m.userData.rough = m.material.roughness; } }

$('btn-color').addEventListener('click', (e) => { if (!colorMode) remember(); colorMode = !colorMode; e.currentTarget.setAttribute('aria-pressed', colorMode); paint(); });
$('btn-cut').addEventListener('click', (e) => { cutOn = !cutOn; e.currentTarget.setAttribute('aria-pressed', cutOn); paint(); });
$('btn-show').addEventListener('click', () => { hidden.clear(); isolated = null; paint(); refresh(); });
$('btn-home').addEventListener('click', () => homeView());

// ---------------------------------------------------------------- selección con el puntero
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const objs = [];
  for (const p of parts.values()) if (p.obj.visible && (!isolated || isolated.has(p.pid))) objs.push(...p.meshes);
  for (const h of ray.intersectObjects(objs, false)) {
    if (cutOn && h.point.z > 0) continue;
    return h.object.userData.part;
  }
  return null;
}
let down = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down = null; return; }
  down = null;
  const pid = pick(e);
  if (pid) select(pid); else { selected = null; paint(); renderOverview(); setHash(''); refreshList(); }
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || e.buttons) { $('tip').hidden = true; return; }
  const pid = pick(e);
  if (pid !== hovered) { hovered = pid; paint(); }
  const tip = $('tip');
  if (pid) {
    const r = stage.getBoundingClientRect();
    tip.textContent = parts.get(pid).nombre;
    tip.style.left = `${e.clientX - r.left}px`;
    tip.style.top = `${e.clientY - r.top}px`;
    tip.hidden = false;
    cv.style.cursor = 'pointer';
  } else { tip.hidden = true; cv.style.cursor = ''; }
});
cv.addEventListener('pointerleave', () => { $('tip').hidden = true; if (hovered) { hovered = null; paint(); } });
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('lightbox').hidden) { closeLightbox(); return; }
  if (selected) { selected = null; paint(); renderOverview(); setHash(''); refreshList(); }
});

function focusOn(pid) {
  const p = parts.get(pid);
  const box = new THREE.Box3().setFromObject(p.obj);
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = Math.min(4, Math.max(0.5, size * 2.2)) * Math.max(1, 1.2 / camera.aspect);
  flyTo(c, c.clone().addScaledVector(dir, dist));
}
function setHash(h) { try { history.replaceState(null, '', h ? `#${h.replace(/_/g, '-')}` : location.pathname + location.search); } catch (e) { /* sin historial */ } }

function select(pid, opts = {}) {
  selected = pid;
  paint();
  renderPart(pid);
  setHash(pid);
  showTab('ficha');
  refreshList();
  if (opts.focus) focusOn(pid);
}

// ---------------------------------------------------------------- panel
function showTab(t) {
  for (const n of ['ficha', 'piezas']) {
    $(`tab-${n}`).setAttribute('aria-selected', n === t);
    $(`pane-${n}`).hidden = n !== t;
  }
}
$('tab-ficha').addEventListener('click', () => showTab('ficha'));
$('tab-piezas').addEventListener('click', () => showTab('piezas'));

function chip(conj) {
  return `<button class="chip" type="button" data-conj="${esc(conj)}"><span class="dot" style="background:${CONJ[conj]?.color}"></span>${esc(conj)}</button>`;
}
function laminas(conj) {
  const ls = CONJ[conj]?.laminas || [];
  if (!ls.length) return '';
  return `<h3>Despiece del manual</h3><div class="thumbs">${ls.map(([f, cap]) =>
    `<button class="thumb" type="button" data-img="${esc(f)}" data-cap="${esc(cap)}" title="${esc(cap)}"><img loading="lazy" alt="${esc(cap)}" src="laminas/${esc(f)}" data-fallback="../../Adjuntos/Torno TM300/${esc(f)}"></button>`).join('')}</div>`;
}
function partsOf(conj) { return [...parts.values()].filter((p) => p.conjunto === conj); }

function renderOverview() {
  const counts = ORDER.map((c) => `<button class="row" type="button" data-conj="${esc(c)}"><span class="dot" style="background:${CONJ[c].color}"></span>${esc(c)}<span class="n">${partsOf(c).length}</span></button>`).join('');
  $('pane-ficha').innerHTML = `
    <span class="chip"><span class="dot" style="background:var(--accent)"></span>Vista general</span>
    <h2 class="name">${parts.size} piezas en ${ORDER.length} conjuntos</h2>
    <p>Tocá una pieza del modelo para ver qué es, sus datos y cómo se mantiene. Con el deslizador <b>Despiece</b> se separan los conjuntos siguiendo su dirección de montaje.</p>
    <h3>Datos del manual (C0632A)</h3>
    <table class="data"><tbody>
      <tr><th>Altura de centros</th><td>166 mm</td></tr>
      <tr><th>Volteo sobre bancada</th><td>330 mm</td></tr>
      <tr><th>Distancia entre puntas</th><td>1000 mm</td></tr>
      <tr><th>Ancho / alto de bancada</th><td>187 / 290 mm</td></tr>
      <tr><th>Husillo</th><td>Camlock D1-4 · MT5 · pasaje Ø38</td></tr>
      <tr><th>Velocidades</th><td>8, de 70 a 2000 rpm</td></tr>
      <tr><th>Motor</th><td>1,5 kW · IEC 90S-4</td></tr>
      <tr><th>Tornillo patrón / barra</th><td>Ø22 paso 3 mm / Ø19</td></tr>
    </tbody></table>
    <h3>Conjuntos</h3>
    <div class="list">${counts}</div>
    <p class="note">Modelo por conjuntos con las cotas que da el manual. Lo que el manual no acota (gabinetes, formas del cabezal y del delantal) sigue las proporciones de un torno 12×36 genérico, no las de la unidad del taller.</p>`;
}

function renderConj(conj) {
  const c = CONJ[conj];
  const ps = partsOf(conj).map((p) => `<button class="row" type="button" data-pid="${p.pid}"${p.pid === selected ? ' aria-current="true"' : ''}>${esc(p.nombre)}</button>`).join('');
  $('pane-ficha').innerHTML = `
    ${chip(conj)}
    <h2 class="name">${esc(conj)}</h2>
    <p>${esc(c.resumen)}</p>
    <div class="btn-row"><button class="btn" type="button" data-act="iso-conj" data-conj="${esc(conj)}">Aislar conjunto</button></div>
    <h3>Piezas</h3><div class="list">${ps}</div>
    ${laminas(conj)}
    <p class="ver">En el vault: <b>${esc(c.nota)}</b></p>`;
}

function renderPart(pid) {
  const p = parts.get(pid);
  const f = FICHAS.piezas[pid] || {};
  const datos = (f.datos || []).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
  const mant = (f.mant || []).map((m) => `<li>${esc(m)}</li>`).join('');
  $('pane-ficha').innerHTML = `
    ${chip(p.conjunto)}
    <h2 class="name">${esc(p.nombre)}</h2>
    <div class="btn-row">
      <button class="btn" type="button" data-act="focus">Centrar</button>
      <button class="btn" type="button" data-act="iso" aria-pressed="${!!(isolated && isolated.size === 1 && isolated.has(pid))}">Aislar</button>
      <button class="btn" type="button" data-act="hide">Ocultar</button>
    </div>
    ${f.que ? `<h3>Qué es</h3><p>${esc(f.que)}</p>` : ''}
    ${datos ? `<h3>Datos</h3><table class="data"><tbody>${datos}</tbody></table>` : ''}
    ${mant ? `<h3>Mantenimiento</h3><ul class="mant">${mant}</ul>` : ''}
    ${laminas(p.conjunto)}
    ${f.ver ? `<p class="ver">Más en el vault: <b>${esc(f.ver)}</b></p>` : ''}`;
}

$('pane-ficha').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.pid) { select(b.dataset.pid, { focus: true }); return; }
  if (b.dataset.img) { openLightbox(b.dataset.img, b.dataset.cap); return; }
  const act = b.dataset.act;
  if (act === 'focus' && selected) focusOn(selected);
  else if (act === 'iso' && selected) {
    isolated = isolated && isolated.size === 1 && isolated.has(selected) ? null : new Set([selected]);
    paint(); renderPart(selected);
  } else if (act === 'hide' && selected) {
    hidden.add(selected); selected = null; paint(); renderOverview(); setHash(''); refreshList();
  } else if (act === 'iso-conj') {
    isolated = new Set(partsOf(b.dataset.conj).map((p) => p.pid)); paint();
  } else if (b.dataset.conj) {
    renderConj(b.dataset.conj);
  }
});
$('pane-ficha').addEventListener('error', (e) => {
  const img = e.target;
  if (img.tagName === 'IMG' && img.dataset.fallback && img.src.indexOf('Adjuntos') < 0) img.src = img.dataset.fallback;
}, true);

function refresh() { if (selected) renderPart(selected); else renderOverview(); }

// ---------------------------------------------------------------- lista de piezas
function buildList() {
  $('plist').innerHTML = ORDER.map((c) => `
    <div class="group" data-group="${esc(c)}">
      <div class="group-h"><span class="dot" style="background:${CONJ[c].color}"></span>${esc(c)}</div>
      <div class="list">${partsOf(c).map((p) => `<button class="row" type="button" data-pid="${p.pid}" data-q="${esc((p.nombre + ' ' + c + ' ' + (FICHAS.piezas[p.pid]?.datos || []).map((d) => d[1]).join(' ')).toLowerCase())}">${esc(p.nombre)}</button>`).join('')}</div>
    </div>`).join('');
}
function refreshList() {
  for (const r of $('plist').querySelectorAll('.row')) r.setAttribute('aria-current', r.dataset.pid === selected);
}
$('plist').addEventListener('click', (e) => { const b = e.target.closest('.row'); if (b) select(b.dataset.pid, { focus: true }); });
$('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const g of $('plist').querySelectorAll('.group')) {
    let any = false;
    for (const r of g.querySelectorAll('.row')) { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; any = any || ok; }
    g.hidden = !any;
  }
});

// ---------------------------------------------------------------- láminas ampliadas
function openLightbox(f, cap) {
  const img = $('lb-img');
  img.onerror = () => { img.onerror = null; img.src = `../../Adjuntos/Torno TM300/${f}`; };
  img.src = `laminas/${f}`;
  img.alt = cap;
  $('lb-cap').textContent = cap;
  $('lightbox').hidden = false;
  $('lb-close').focus();
}
function closeLightbox() { $('lightbox').hidden = true; }
$('lb-close').addEventListener('click', closeLightbox);
$('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });

// ---------------------------------------------------------------- bucle
renderer.setAnimationLoop((now) => {
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.dur);
    setExplode(anim.from + (anim.to - anim.from) * k);
    if (k >= 1) anim = null;
  }
  if (fly) {
    const k = ease(Math.min(1, (now - fly.t0) / fly.dur));
    controls.target.lerpVectors(fly.ft, fly.tt, k);
    camera.position.lerpVectors(fly.fp, fly.tp, k);
    if (k >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
