<style>
/* Layout: escenario 3D a la izquierda, ficha técnica a la derecha (apilado en el celular). */
:root {
  --bg: #e9ecee;
  --panel: #fbfbfa;
  --stage: #dfe3e6;
  --ink: #1b2024;
  --muted: #5a6670;
  --line: #d3d8dc;
  --accent: #a85a12;
  --accent-ink: #ffffff;
  --accent-bg: #f6e6d2;
  --grid: #c3c9ce;
  --chip: #eef0f2;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171a; --panel: #1b1f23; --stage: #101315; --ink: #e5e8eb; --muted: #9ba5ae;
    --line: #2d3339; --accent: #f0a24a; --accent-ink: #1b1206; --accent-bg: #3a2a17;
    --grid: #262c32; --chip: #23292e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171a; --panel: #1b1f23; --stage: #101315; --ink: #e5e8eb; --muted: #9ba5ae;
  --line: #2d3339; --accent: #f0a24a; --accent-ink: #1b1206; --accent-bg: #3a2a17;
  --grid: #262c32; --chip: #23292e; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 390px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top" "stage panel";
}
.top {
  grid-area: top;
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.01em; margin: 0; line-height: 1.1; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 13px; }
.top .plate { margin-left: auto; font-family: var(--font-data); font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }

.stage { grid-area: stage; position: relative; background: var(--stage); min-height: 0; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-data); color: var(--muted); font-size: 13px; }
.tip {
  position: absolute; pointer-events: none; padding: 4px 8px; border-radius: 4px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  font-size: 12px; font-weight: 500; white-space: nowrap; transform: translate(12px, 12px);
}
.controls {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(6px);
}
.slider { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0; }
.slider label { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: 0.03em; text-transform: uppercase; }
.slider input { flex: 1; min-width: 0; accent-color: var(--accent); }
.slider output { font-family: var(--font-data); font-size: 12px; width: 6ch; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 6px 11px; font-size: 13px; font-weight: 500; line-height: 1.2;
}
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; }

.panel { grid-area: panel; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 12px; gap: 4px; }
.tab {
  border: 0; background: none; padding: 10px 10px 9px; font-family: var(--font-display); font-weight: 600;
  font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { overflow-y: auto; padding: 16px 18px 28px; min-height: 0; flex: 1; }

.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--chip);
  border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; font-weight: 500;
}
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
h2.name { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 10px 0 8px; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
p { margin: 0 0 10px; max-width: 65ch; }
.data { width: 100%; border-collapse: collapse; font-size: 13px; }
.data th, .data td { text-align: left; vertical-align: top; padding: 6px 0; border-bottom: 1px solid var(--line); }
.data th { font-weight: 500; color: var(--muted); width: 42%; padding-right: 10px; }
.data td { font-family: var(--font-data); font-size: 12.5px; }
ul.mant { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.ver { margin-top: 18px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.ver b { color: var(--ink); font-weight: 500; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.thumb { border: 1px solid var(--line); border-radius: 6px; padding: 4px; background: #fff; overflow: hidden; aspect-ratio: 3 / 4; max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
.list { display: grid; gap: 2px; }
.row {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 7px 8px; border-radius: 6px; font-size: 13.5px;
}
.row:hover { background: var(--chip); }
.row[aria-current="true"] { background: var(--accent-bg); }
.row .n { margin-left: auto; font-family: var(--font-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.group-h { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 4px; display: flex; align-items: center; gap: 8px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 10px; }
.note { font-size: 12.5px; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 9px 11px; margin-top: 14px; }
.lightbox { position: fixed; inset: 0; background: rgba(10, 12, 14, 0.82); z-index: 20; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.lightbox .lb-bar { display: flex; align-items: center; gap: 10px; color: #f1f3f4; padding-bottom: 8px; }
.lightbox .lb-bar span { flex: 1; font-size: 13px; min-width: 0; }
.lightbox .lb-img { flex: 1; overflow: auto; background: #fff; border-radius: 6px; }
.lightbox img { display: block; max-width: none; width: 100%; min-width: 600px; }

/* ---------- Enfoque de una pieza: botón de volver, modo animación y datos flotantes ---------- */
.glass { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.focus-bar { position: absolute; top: 14px; left: 14px; z-index: 6; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 200px); }
.back {
  display: inline-flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px 0 12px; border-radius: 26px; flex: none;
  font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: 0.04em; text-transform: uppercase;
  box-shadow: 0 4px 18px rgb(0 0 0 / 0.16);
}
.back svg { width: 28px; height: 28px; flex: none; }
.back:hover { border-color: var(--accent); color: var(--accent); }
.focus-name { display: inline-flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 14px 6px 10px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.focus-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mode { position: absolute; top: 14px; right: 14px; z-index: 6; display: inline-flex; align-items: center; gap: 9px; padding: 7px 13px 7px 9px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.mode .sw { width: 32px; height: 18px; border-radius: 9px; background: var(--line); position: relative; transition: background 0.2s; flex: none; }
.mode .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgb(0 0 0 / 0.3); transition: transform 0.2s; }
.mode[aria-pressed="true"] .sw { background: var(--accent); }
.mode[aria-pressed="true"] .sw::after { transform: translateX(14px); }
.stage.focused .controls { display: none; }
.fx { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.fx svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fx polyline { fill: none; stroke: var(--accent); stroke-width: 1.4; opacity: 0.75; }
.fx circle { fill: var(--accent); }
.fx circle.halo { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: 0.45; }
.card {
  position: absolute; pointer-events: auto; overflow: auto; padding: 10px 13px 11px; border-radius: 10px;
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 8px 26px rgb(0 0 0 / 0.16);
  transition: opacity 0.3s ease, transform 0.3s ease; animation: flotar 5s ease-in-out infinite;
}
.card.out { opacity: 0; transform: translateY(10px) scale(0.97); }
@keyframes flotar { 0%, 100% { translate: 0 0; } 50% { translate: 0 -7px; } }
.card .k { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.card .v { font-size: 13.5px; line-height: 1.45; }
.card .v.mono { font-family: var(--font-data); font-size: 13px; }
.card h4 { font-family: var(--font-display); font-weight: 700; font-size: 27px; line-height: 1.05; margin: 4px 0 6px; text-wrap: balance; }
.card p { margin: 0 0 6px; font-size: 13.5px; }
.card .chipline { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--muted); }
.card table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.card th, .card td { text-align: left; vertical-align: top; padding: 4px 0; border-bottom: 1px solid var(--line); }
.card th { font-weight: 500; color: var(--muted); width: 44%; padding-right: 8px; }
.card td { font-family: var(--font-data); }
.card ul { margin: 0; padding-left: 17px; display: grid; gap: 4px; font-size: 13px; }
.card .sec + .sec { margin-top: 10px; }
.card .num { font-family: var(--font-data); color: var(--accent); font-size: 12px; margin-left: 6px; }
.pager { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; display: flex; gap: 3px; padding: 4px; border-radius: 999px; max-width: calc(100% - 20px); }
.pager button { position: relative; overflow: hidden; border: 0; background: none; padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.pager button[aria-current="true"] { background: var(--accent-bg); color: var(--ink); }
.pager .prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent); }
.pager .pause { font-family: var(--font-data); }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 62vh auto; grid-template-areas: "top" "stage" "panel"; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .pane { overflow: visible; }
  .top .plate { display: none; }
  .controls { left: 8px; right: 8px; bottom: 8px; }
  .focus-bar { top: 10px; left: 10px; max-width: calc(100% - 150px); }
  .back { height: 46px; font-size: 19px; padding: 0 16px 0 10px; }
  .mode { top: 12px; right: 10px; padding: 6px 11px 6px 8px; }
  .focus-name { display: none; }
  .card h4 { font-size: 23px; }
  .pager { bottom: 8px; }
  .pager button { padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .card { animation: none; } }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const FICHAS = await fetch('fichas.json').then((r) => r.json());
const CONJ = FICHAS.conjuntos;
const ORDER = Object.keys(CONJ);

// ---------------------------------------------------------------- escena
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(-2, 4, 3);
scene.add(sun, new THREE.HemisphereLight(0xffffff, 0x666666, 0.6));

const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.62;
controls.minDistance = 0.35;
controls.maxDistance = 9;

const HOME_T = new THREE.Vector3(0.88, 0.82, 0);
const HOME_D = new THREE.Vector3(-0.55, 0.5, 1).normalize();
let grid;

// Enfoque de una pieza (aislada y con zoom) y modo animación.
// Diagonal en metros. Por debajo: pieza chica o mediana-chica (mordazas … plato, cuerpo del contrapunto),
// que anima por enfoques. Por encima: mediana-grande o grande (base del contrapunto, delantal, carro, bancada…).
const SMALL = 0.34;
const PAGE_MS = 7000;   // tiempo de cada enfoque de datos antes del giro rápido
let focus = null;       // { pid, prev, center, radius, region, show }
let vo = { x: 0, y: 0 }; // corrimiento de la vista (para dejar lugar a las tarjetas)
let animMode = false;
try { animMode = localStorage.getItem('tm300-anim') === '1'; } catch (e) { /* sin almacenamiento */ }
function applyViewOffset() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (Math.abs(vo.x) < 0.5 && Math.abs(vo.y) < 0.5) camera.clearViewOffset();
  else camera.setViewOffset(w, h, vo.x, vo.y, w, h);
  camera.updateProjectionMatrix();
}

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function applyTheme() {
  scene.background = new THREE.Color(cssVar('--stage'));
  if (grid) scene.remove(grid);
  grid = new THREE.GridHelper(6, 30, cssVar('--grid'), cssVar('--grid'));
  grid.position.set(0.9, 0, 0);
  scene.add(grid);
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  applyViewOffset();
  if (focus && parts.size) {
    const wasNarrow = focus.region && focus.region.narrow;
    fitFocus(false);
    // si cambió entre diseño angosto y ancho, las tarjetas se arman de nuevo (una sola o varias)
    if (focus.show) { if (focus.region.narrow !== wasNarrow) renderCards(); else layoutCards(); }
  }
}
new ResizeObserver(resize).observe(stage);
resize();

function homeView(animate = true, t = explodeT) {
  const dist = 3.7 * Math.max(1, 1.5 / camera.aspect) * (0.8 + 0.4 * t);
  flyTo(HOME_T.clone(), HOME_T.clone().addScaledVector(HOME_D, dist), animate, { x: 0, y: 0 });
}

// ---------------------------------------------------------------- vuelo de cámara
let fly = null;
function flyTo(target, pos, animate = true, off = vo) {
  if (!animate || reduced) { fly = null; controls.target.copy(target); camera.position.copy(pos); vo = { ...off }; applyViewOffset(); return; }
  fly = { t0: performance.now(), dur: 800, ft: controls.target.clone(), fp: camera.position.clone(), tt: target, tp: pos, fo: { ...vo }, to: { ...off } };
}

// ---------------------------------------------------------------- piezas
const parts = new Map();        // pid -> {obj, base, vec, conjunto, nombre, meshes}
const HL = new THREE.Color(cssVar('--accent') || '#f0a24a');
const cut = [new THREE.Plane(new THREE.Vector3(0, 0, -1), 0)];
let explodeT = 0, selected = null, hovered = null, colorMode = false, cutOn = false, isolated = null;
const hidden = new Set();

// El modelo viene como glTF con el binario embebido en base64 (las páginas
// publicadas no sirven .glb). La política de seguridad del visor bloquea que
// GLTFLoader lea ese data:, así que se decodifica acá y se arma un GLB en memoria.
async function loadModelBuffer(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const total = Number(res.headers.get('content-length')) || 0;
  let text;
  if (res.body && total) {
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      $('loading').textContent = `Cargando el modelo… ${Math.min(100, Math.round(100 * got / total))} %`;
    }
    text = new TextDecoder().decode(await new Blob(chunks).arrayBuffer());
  } else {
    text = await res.text();
  }
  const doc = JSON.parse(text);
  const uri = doc.buffers[0].uri;
  const b64 = atob(uri.slice(uri.indexOf(',') + 1));
  const bin = new Uint8Array(b64.length);
  for (let i = 0; i < b64.length; i++) bin[i] = b64.charCodeAt(i);
  delete doc.buffers[0].uri;
  doc.buffers[0].byteLength = bin.length;
  const json = new TextEncoder().encode(JSON.stringify(doc));
  const jl = Math.ceil(json.length / 4) * 4, bl = Math.ceil(bin.length / 4) * 4;
  const out = new Uint8Array(12 + 8 + jl + 8 + bl);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, out.length, true);
  dv.setUint32(12, jl, true); dv.setUint32(16, 0x4E4F534A, true);
  out.fill(0x20, 20, 20 + jl); out.set(json, 20);
  dv.setUint32(20 + jl, bl, true); dv.setUint32(24 + jl, 0x004E4942, true);
  out.set(bin, 28 + jl);
  return out.buffer;
}

function modelError(err) {
  console.error(err);
  $('loading').textContent = 'No se pudo cargar el modelo 3D. Recargá la página.';
}

const loader = new GLTFLoader();
loadModelBuffer('torno_tm300.json').then((buf) => loader.parse(buf, '', onModel, modelError)).catch(modelError);

function onModel(gltf) {
  scene.add(gltf.scene);
  gltf.scene.traverse((o) => {
    if (!o.userData || !o.userData.pid || parts.has(o.userData.pid)) return;
    const u = o.userData;
    const e = u.explode || [0, 0, 0];
    const meshes = [];
    o.traverse((m) => {
      if (!m.isMesh) return;
      m.material = m.material.clone();
      m.material.side = THREE.DoubleSide;
      m.userData.orig = m.material.color.clone();
      m.userData.part = u.pid;
      meshes.push(m);
    });
    parts.set(u.pid, {
      pid: u.pid, obj: o, nombre: u.nombre, conjunto: u.conjunto, meshes,
      base: o.position.clone(), vec: new THREE.Vector3(e[0], e[2], -e[1]),
    });
  });
  // tamaño de cada pieza (diagonal de su caja, armada): decide cómo se anima
  gltf.scene.updateMatrixWorld(true);
  for (const p of parts.values()) p.size = new THREE.Box3().setFromObject(p.obj).getSize(new THREE.Vector3()).length();
  $('loading').hidden = true;
  buildList();
  homeView(false);
  updateFocusUi();
  const h = location.hash.slice(1).replace(/-/g, '_');
  if (h && parts.has(h)) { renderOverview(); enterFocus(h, false); } else renderOverview();
}

function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function setExplode(t) {
  explodeT = t;
  const k = ease(t);
  for (const p of parts.values()) p.obj.position.copy(p.base).addScaledVector(p.vec, k);
  $('explode').value = Math.round(t * 100);
  $('explode-out').textContent = `${Math.round(t * 100)} %`;
  $('btn-anim').textContent = t > 0.5 ? 'Armar' : 'Despiezar';
}
let anim = null;
$('explode').addEventListener('input', (e) => { anim = null; setExplode(e.target.value / 100); });
$('btn-anim').addEventListener('click', () => {
  const to = explodeT > 0.5 ? 0 : 1;
  if (!selected) homeView(true, to);
  if (reduced) { setExplode(to); return; }
  anim = { t0: performance.now(), from: explodeT, to, dur: 1400 };
});

function paint() {
  for (const p of parts.values()) {
    const ghost = isolated && !isolated.has(p.pid);
    const col = colorMode ? new THREE.Color(CONJ[p.conjunto]?.color || '#888') : null;
    for (const m of p.meshes) {
      const mat = m.material;
      mat.color.copy(col || m.userData.orig);
      if (colorMode) { mat.metalness = 0.1; mat.roughness = 0.6; } else { mat.metalness = m.userData.metal ?? (m.userData.metal = mat.metalness); mat.roughness = m.userData.rough ?? (m.userData.rough = mat.roughness); }
      mat.emissive.set(0x000000);
      mat.emissiveIntensity = 1;
      if (!focus && p.pid === selected) { mat.emissive.copy(HL); mat.emissiveIntensity = 0.55; }
      else if (!focus && p.pid === hovered) { mat.emissive.copy(HL); mat.emissiveIntensity = 0.22; }
      mat.transparent = !!ghost;
      mat.opacity = ghost ? (focus ? 0.06 : 0.1) : 1;
      mat.depthWrite = !ghost;
      mat.clippingPlanes = cutOn && !focus ? cut : [];
      mat.needsUpdate = true;
    }
    // en el modo animación se muestra una copia que gira; la pieza original se oculta
    p.obj.visible = !hidden.has(p.pid) && !(focus && focus.show && focus.pid === p.pid);
  }
  $('btn-show').hidden = !(hidden.size || isolated);
}
// guardar metal/rugosidad originales antes de cualquier cambio
function remember() { for (const p of parts.values()) for (const m of p.meshes) { m.userData.metal = m.material.metalness; m.userData.rough = m.material.roughness; } }

$('btn-color').addEventListener('click', (e) => { if (!colorMode) remember(); colorMode = !colorMode; e.currentTarget.setAttribute('aria-pressed', colorMode); paint(); });
$('btn-cut').addEventListener('click', (e) => { cutOn = !cutOn; e.currentTarget.setAttribute('aria-pressed', cutOn); paint(); });
$('btn-show').addEventListener('click', () => { hidden.clear(); isolated = null; paint(); refresh(); });
$('btn-home').addEventListener('click', () => homeView());

// ---------------------------------------------------------------- selección con el puntero
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (focus && focus.show) return ray.intersectObject(focus.show.clone, true).length ? focus.pid : null;
  const objs = [];
  for (const p of parts.values()) if (p.obj.visible && (!isolated || isolated.has(p.pid))) objs.push(...p.meshes);
  for (const h of ray.intersectObjects(objs, false)) {
    if (cutOn && h.point.z > 0) continue;
    return h.object.userData.part;
  }
  return null;
}
let down = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down = null; return; }
  down = null;
  const pid = pick(e);
  if (focus) {
    // con una pieza enfocada: tocarla pasa al siguiente enfoque de datos (piezas chicas en modo animación)
    const s = focus.show;
    if (pid && s && s.small && s.pages.length > 1) goPage((s.page + 1) % s.pages.length);
    return;
  }
  if (pid) enterFocus(pid); else { selected = null; paint(); renderOverview(); setHash(''); refreshList(); }
});
cv.addEventListener('pointermove', (e) => {
  if (focus) { $('tip').hidden = true; cv.style.cursor = focus.show && pick(e) ? 'pointer' : ''; return; }
  if (e.pointerType !== 'mouse' || e.buttons) { $('tip').hidden = true; return; }
  const pid = pick(e);
  if (pid !== hovered) { hovered = pid; paint(); }
  const tip = $('tip');
  if (pid) {
    const r = stage.getBoundingClientRect();
    tip.textContent = parts.get(pid).nombre;
    tip.style.left = `${e.clientX - r.left}px`;
    tip.style.top = `${e.clientY - r.top}px`;
    tip.hidden = false;
    cv.style.cursor = 'pointer';
  } else { tip.hidden = true; cv.style.cursor = ''; }
});
cv.addEventListener('pointerleave', () => { $('tip').hidden = true; if (hovered) { hovered = null; paint(); } });
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('lightbox').hidden) { closeLightbox(); return; }
  if (focus) { exitFocus(); return; }
  if (selected) { selected = null; paint(); renderOverview(); setHash(''); refreshList(); }
});

function focusOn(pid) {
  const p = parts.get(pid);
  const box = new THREE.Box3().setFromObject(p.obj);
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = Math.min(4, Math.max(0.5, size * 2.2)) * Math.max(1, 1.2 / camera.aspect);
  flyTo(c, c.clone().addScaledVector(dir, dist));
}
function setHash(h) { try { history.replaceState(null, '', h ? `#${h.replace(/_/g, '-')}` : location.pathname + location.search); } catch (e) { /* sin historial */ } }

// Elegir una pieza (en el modelo, la lista o la ficha) siempre la enfoca: aislada y con zoom.
function select(pid) { enterFocus(pid); }

// ---------------------------------------------------------------- panel
function showTab(t) {
  for (const n of ['ficha', 'piezas']) {
    $(`tab-${n}`).setAttribute('aria-selected', n === t);
    $(`pane-${n}`).hidden = n !== t;
  }
}
$('tab-ficha').addEventListener('click', () => showTab('ficha'));
$('tab-piezas').addEventListener('click', () => showTab('piezas'));

function chip(conj) {
  return `<button class="chip" type="button" data-conj="${esc(conj)}"><span class="dot" style="background:${CONJ[conj]?.color}"></span>${esc(conj)}</button>`;
}
function laminas(conj) {
  const ls = CONJ[conj]?.laminas || [];
  if (!ls.length) return '';
  return `<h3>Despiece del manual</h3><div class="thumbs">${ls.map(([f, cap]) =>
    `<button class="thumb" type="button" data-img="${esc(f)}" data-cap="${esc(cap)}" title="${esc(cap)}"><img loading="lazy" alt="${esc(cap)}" src="laminas/${esc(f)}" data-fallback="../../Adjuntos/Torno TM300/${esc(f)}"></button>`).join('')}</div>`;
}
function partsOf(conj) { return [...parts.values()].filter((p) => p.conjunto === conj); }

function renderOverview() {
  const counts = ORDER.map((c) => `<button class="row" type="button" data-conj="${esc(c)}"><span class="dot" style="background:${CONJ[c].color}"></span>${esc(c)}<span class="n">${partsOf(c).length}</span></button>`).join('');
  $('pane-ficha').innerHTML = `
    <span class="chip"><span class="dot" style="background:var(--accent)"></span>Vista general</span>
    <h2 class="name">${parts.size} piezas en ${ORDER.length} conjuntos</h2>
    <p>Tocá una pieza del modelo: se aísla, la cámara se acerca y acá aparece qué es, sus datos y cómo se mantiene. Con <b>← Volver</b> (o Esc) regresás a la vista anterior. Con el deslizador <b>Despiece</b> se separan los conjuntos siguiendo su dirección de montaje.</p>
    <p>Con el <b>Modo animación</b> activado, la pieza elegida gira con sus datos flotando alrededor. Las piezas chicas cambian de enfoque (identificación, características, mantenimiento) con un giro rápido; las grandes muestran todo junto.</p>
    <h3>Datos del manual (C0632A)</h3>
    <table class="data"><tbody>
      <tr><th>Altura de centros</th><td>166 mm</td></tr>
      <tr><th>Volteo sobre bancada</th><td>330 mm</td></tr>
      <tr><th>Distancia entre puntas</th><td>1000 mm</td></tr>
      <tr><th>Ancho / alto de bancada</th><td>187 / 290 mm</td></tr>
      <tr><th>Husillo</th><td>Camlock D1-4 · MT5 · pasaje Ø38</td></tr>
      <tr><th>Velocidades</th><td>8, de 70 a 2000 rpm</td></tr>
      <tr><th>Motor</th><td>1,5 kW · IEC 90S-4</td></tr>
      <tr><th>Tornillo patrón / barra</th><td>Ø22 paso 3 mm / Ø19</td></tr>
    </tbody></table>
    <h3>Conjuntos</h3>
    <div class="list">${counts}</div>
    <p class="note">Modelo por conjuntos con las cotas que da el manual. Lo que el manual no acota (gabinetes, formas del cabezal y del delantal) sigue las proporciones de un torno 12×36 genérico, no las de la unidad del taller.</p>`;
}

function renderConj(conj) {
  const c = CONJ[conj];
  const ps = partsOf(conj).map((p) => `<button class="row" type="button" data-pid="${p.pid}"${p.pid === selected ? ' aria-current="true"' : ''}>${esc(p.nombre)}</button>`).join('');
  $('pane-ficha').innerHTML = `
    ${chip(conj)}
    <h2 class="name">${esc(conj)}</h2>
    <p>${esc(c.resumen)}</p>
    <div class="btn-row"><button class="btn" type="button" data-act="iso-conj" data-conj="${esc(conj)}">Aislar conjunto</button></div>
    <h3>Piezas</h3><div class="list">${ps}</div>
    ${laminas(conj)}
    <p class="ver">En el vault: <b>${esc(c.nota)}</b></p>`;
}

function renderPart(pid) {
  const p = parts.get(pid);
  const f = FICHAS.piezas[pid] || {};
  const datos = (f.datos || []).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
  const mant = (f.mant || []).map((m) => `<li>${esc(m)}</li>`).join('');
  $('pane-ficha').innerHTML = `
    ${chip(p.conjunto)}
    <h2 class="name">${esc(p.nombre)}</h2>
    <div class="btn-row">
      <button class="btn" type="button" data-act="focus">Centrar</button>
      ${focus ? '<button class="btn" type="button" data-act="back">← Volver</button>' : `
      <button class="btn" type="button" data-act="iso" aria-pressed="${!!(isolated && isolated.size === 1 && isolated.has(pid))}">Aislar</button>
      <button class="btn" type="button" data-act="hide">Ocultar</button>`}
    </div>
    ${f.que ? `<h3>Qué es</h3><p>${esc(f.que)}</p>` : ''}
    ${datos ? `<h3>Datos</h3><table class="data"><tbody>${datos}</tbody></table>` : ''}
    ${mant ? `<h3>Mantenimiento</h3><ul class="mant">${mant}</ul>` : ''}
    ${laminas(p.conjunto)}
    ${f.ver ? `<p class="ver">Más en el vault: <b>${esc(f.ver)}</b></p>` : ''}`;
}

$('pane-ficha').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.pid) { select(b.dataset.pid); return; }
  if (b.dataset.img) { openLightbox(b.dataset.img, b.dataset.cap); return; }
  const act = b.dataset.act;
  if (act === 'focus' && focus) fitFocus();
  else if (act === 'focus' && selected) focusOn(selected);
  else if (act === 'back') exitFocus();
  else if (act === 'iso' && selected) {
    isolated = isolated && isolated.size === 1 && isolated.has(selected) ? null : new Set([selected]);
    paint(); renderPart(selected);
  } else if (act === 'hide' && selected) {
    hidden.add(selected); selected = null; paint(); renderOverview(); setHash(''); refreshList();
  } else if (act === 'iso-conj') {
    isolated = new Set(partsOf(b.dataset.conj).map((p) => p.pid)); paint();
  } else if (b.dataset.conj) {
    renderConj(b.dataset.conj);
  }
});
$('pane-ficha').addEventListener('error', (e) => {
  const img = e.target;
  if (img.tagName === 'IMG' && img.dataset.fallback && img.src.indexOf('Adjuntos') < 0) img.src = img.dataset.fallback;
}, true);

function refresh() { if (selected) renderPart(selected); else renderOverview(); }

// ---------------------------------------------------------------- lista de piezas
function buildList() {
  $('plist').innerHTML = ORDER.map((c) => `
    <div class="group" data-group="${esc(c)}">
      <div class="group-h"><span class="dot" style="background:${CONJ[c].color}"></span>${esc(c)}</div>
      <div class="list">${partsOf(c).map((p) => `<button class="row" type="button" data-pid="${p.pid}" data-q="${esc((p.nombre + ' ' + c + ' ' + (FICHAS.piezas[p.pid]?.datos || []).map((d) => d[1]).join(' ')).toLowerCase())}">${esc(p.nombre)}</button>`).join('')}</div>
    </div>`).join('');
}
function refreshList() {
  for (const r of $('plist').querySelectorAll('.row')) r.setAttribute('aria-current', r.dataset.pid === selected);
}
$('plist').addEventListener('click', (e) => { const b = e.target.closest('.row'); if (b) select(b.dataset.pid); });
$('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const g of $('plist').querySelectorAll('.group')) {
    let any = false;
    for (const r of g.querySelectorAll('.row')) { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; any = any || ok; }
    g.hidden = !any;
  }
});

// ---------------------------------------------------------------- láminas ampliadas
function openLightbox(f, cap) {
  const img = $('lb-img');
  img.onerror = () => { img.onerror = null; img.src = `../../Adjuntos/Torno TM300/${f}`; };
  img.src = `laminas/${f}`;
  img.alt = cap;
  $('lb-cap').textContent = cap;
  $('lightbox').hidden = false;
  $('lb-close').focus();
}
function closeLightbox() { $('lightbox').hidden = true; }
$('lb-close').addEventListener('click', closeLightbox);
$('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });

// ---------------------------------------------------------------- enfoque de una pieza
function enterFocus(pid, animate = true) {
  if (!parts.has(pid)) return;
  if (!focus) {
    focus = { prev: { pos: camera.position.clone(), target: controls.target.clone(), off: { ...vo }, isolated, selected } };
    anim = null;
  } else clearShow();
  focus.pid = pid;
  selected = pid;
  isolated = new Set([pid]);
  hovered = null;
  $('tip').hidden = true;
  stage.classList.add('focused');
  controls.minDistance = 0.04;
  controls.maxDistance = 20;
  camera.near = 0.01;
  if (animMode) startShow(pid);
  paint();
  renderPart(pid);
  setHash(pid);
  showTab('ficha');
  refreshList();
  updateFocusUi();
  fitFocus(animate);
  if (focus.show) renderCards();
}

function exitFocus() {
  if (!focus) return;
  const prev = focus.prev;
  clearShow();
  focus = null;
  stage.classList.remove('focused');
  controls.minDistance = 0.35;
  controls.maxDistance = 9;
  camera.near = 0.05;
  isolated = prev.isolated;
  selected = prev.selected;
  paint();
  refresh();
  setHash(selected || '');
  refreshList();
  updateFocusUi();
  flyTo(prev.target, prev.pos, true, prev.off);
}
$('btn-back').addEventListener('click', exitFocus);

function cardW(W) { return Math.round(Math.min(290, Math.max(200, W * 0.24))); }
// Zona de la pantalla donde va la pieza (el resto queda para las tarjetas y los botones).
function focusRegion() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const cw = cardW(W);
  const narrow = W < 640 || W - 2 * (cw + 40) < 240;
  if (!focus || !focus.show) return { W, H, narrow, cw, cx: W / 2, cy: H / 2 + 22, rw: W - 60, rh: H - 150 };
  if (narrow) return { W, H, narrow, cw, cx: W / 2, cy: H * 0.29, rw: W - 40, rh: H * 0.4 };
  return { W, H, narrow, cw, cx: W / 2, cy: H / 2 + 6, rw: W - 2 * (cw + 40), rh: H - 170 };
}

function fitFocus(animate = true) {
  if (!focus) return;
  const p = parts.get(focus.pid);
  const sph = new THREE.Box3().setFromObject(p.obj).getBoundingSphere(new THREE.Sphere());
  focus.center = sph.center.clone();
  focus.radius = sph.radius;
  const R = focusRegion();
  focus.region = R;
  const rpx = 0.46 * Math.min(R.rw, R.rh);                 // radio de la pieza en pantalla
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(0.08, sph.radius * R.H / (2 * rpx * tanH));
  const dir = camera.position.clone().sub(controls.target);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(-0.45, 0, 1);
  dir.normalize();
  dir.y = 0.45;
  dir.normalize();
  flyTo(sph.center.clone(), sph.center.clone().addScaledVector(dir, d), animate, { x: R.W / 2 - R.cx, y: R.H / 2 - R.cy });
}

function updateFocusUi() {
  $('focus-bar').hidden = !focus;
  $('btn-mode').setAttribute('aria-pressed', animMode);
  const name = $('focus-name');
  name.hidden = !focus || !!(focus && focus.show);
  if (focus) {
    const p = parts.get(focus.pid);
    name.innerHTML = `<span class="dot" style="background:${CONJ[p.conjunto]?.color}"></span><span>${esc(p.nombre)}</span>`;
  }
  const s = focus && focus.show;
  $('fx').hidden = !s;
  $('pager').hidden = !(s && s.small && s.pages.length > 1);
}

$('btn-mode').addEventListener('click', () => {
  animMode = !animMode;
  try { localStorage.setItem('tm300-anim', animMode ? '1' : '0'); } catch (e) { /* sin almacenamiento */ }
  if (focus) {
    if (animMode) startShow(focus.pid); else clearShow();
    paint();
    updateFocusUi();
    fitFocus(true);
    if (focus.show) renderCards();
  } else updateFocusUi();
});

// ---------------------------------------------------------------- modo animación
function startShow(pid) {
  const p = parts.get(pid);
  p.obj.updateWorldMatrix(true, true);
  const center = new THREE.Box3().setFromObject(p.obj).getBoundingSphere(new THREE.Sphere()).center;
  const pivot = new THREE.Group();
  pivot.position.copy(center);
  const clone = p.obj.clone(true);
  p.obj.matrixWorld.decompose(clone.position, clone.quaternion, clone.scale);
  clone.position.sub(center);
  const mats = [];
  clone.traverse((m) => {
    if (!m.isMesh) return;
    m.material = m.material.clone();
    m.material.emissive.set(0x000000);
    m.material.transparent = false;
    m.material.opacity = 1;
    m.material.depthWrite = true;
    m.material.clippingPlanes = [];
    mats.push(m.material);
  });
  pivot.add(clone);
  scene.add(pivot);
  const small = p.size < SMALL;
  const now = performance.now();
  focus.show = { pivot, clone, mats, small, pages: buildPages(pid, small), page: 0, angle: 0, last: now, pageT0: now, spin: null, paused: false };
  renderPager();
}

function clearShow() {
  const s = focus && focus.show;
  if (!s) return;
  scene.remove(s.pivot);
  for (const m of s.mats) m.dispose();
  focus.show = null;
  $('fx-cards').innerHTML = '';
  $('fx-lines').innerHTML = '';
}

// Las "páginas" de datos de una pieza: cada una es un enfoque distinto.
function buildPages(pid, small) {
  const p = parts.get(pid);
  const f = FICHAS.piezas[pid] || {};
  const conj = { name: p.conjunto, color: CONJ[p.conjunto]?.color || '#888' };
  const datos = (f.datos || []).map(([k, v]) => ({ k, v, mono: true }));
  const mant = (f.mant || []).map((m, i, a) => ({ k: 'Mantenimiento', num: `${i + 1}/${a.length}`, v: m }));
  const title = { title: true, conj, nombre: p.nombre, sub: small ? '' : (f.que || '') };
  if (!small) {
    const cards = [title];
    if (datos.length) cards.push({ k: 'Características', table: datos });
    if (mant.length) cards.push({ k: 'Mantenimiento', list: mant.map((m) => m.v) });
    if (f.ver) cards.push({ k: 'En el vault', v: f.ver });
    return [{ name: 'Todo', cards }];
  }
  const pages = [{ name: 'Identificación', cards: [title, f.que ? { k: 'Qué es', v: f.que } : null, f.ver ? { k: 'En el vault', v: f.ver } : null].filter(Boolean) }];
  if (datos.length) pages.push({ name: 'Características', cards: datos });
  if (mant.length) pages.push({ name: 'Mantenimiento', cards: mant });
  return pages;
}

function cardHtml(c) {
  if (c.title) return `<div class="chipline"><span class="dot" style="background:${c.conj.color}"></span>${esc(c.conj.name)}</div><h4>${esc(c.nombre)}</h4>${c.sub ? `<p>${esc(c.sub)}</p>` : ''}`;
  let body = '';
  if (c.table) body = `<table><tbody>${c.table.map((d) => `<tr><th>${esc(d.k)}</th><td>${esc(d.v)}</td></tr>`).join('')}</tbody></table>`;
  else if (c.list) body = `<ul>${c.list.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
  else body = `<div class="v${c.mono ? ' mono' : ''}">${esc(c.v)}</div>`;
  return `<div class="k">${esc(c.k)}${c.num ? `<span class="num">${c.num}</span>` : ''}</div>${body}`;
}

// En pantallas angostas, todas las tarjetas de la página van juntas en una sola, abajo.
function mergedHtml(page) {
  const out = [];
  const datos = [], mant = [];
  for (const c of page.cards) {
    if (c.title) out.push(cardHtml(c));
    else if (c.mono) datos.push(c);
    else if (c.k === 'Mantenimiento' && !c.list) mant.push(c.v);
    else out.push(`<div class="sec">${cardHtml(c)}</div>`);
  }
  if (datos.length) out.push(`<div class="sec">${cardHtml({ k: 'Características', table: datos })}</div>`);
  if (mant.length) out.push(`<div class="sec">${cardHtml({ k: 'Mantenimiento', list: mant })}</div>`);
  return out.join('');
}

function renderCards() {
  const s = focus && focus.show;
  if (!s) return;
  const R = focusRegion();
  const box = $('fx-cards');
  const page = s.pages[s.page];
  const htmls = R.narrow ? [mergedHtml(page)] : page.cards.map(cardHtml);
  box.innerHTML = '';
  htmls.forEach((h, i) => {
    const el = document.createElement('div');
    el.className = 'card out';
    el.innerHTML = h;
    el.style.animationDuration = `${4.4 + (i % 3) * 0.8}s`;
    el.style.animationDelay = `${-i * 1.3}s`;
    box.appendChild(el);
  });
  layoutCards();
  requestAnimationFrame(() => [...box.children].forEach((el, i) => setTimeout(() => el.classList.remove('out'), reduced ? 0 : 90 * i)));
  renderPager();
}

function layoutCards() {
  const s = focus && focus.show;
  if (!s) return;
  const R = focusRegion();
  const els = [...$('fx-cards').children];
  const top = 82, bottom = s.small && s.pages.length > 1 ? 66 : 18, gap = 14;
  if (R.narrow) {
    const el = els[0];
    if (!el) return;
    el.style.left = '10px';
    el.style.width = `${R.W - 20}px`;
    el.style.maxHeight = `${Math.max(120, R.H * 0.5 - bottom)}px`;
    el.style.top = `${R.H - bottom - el.offsetHeight}px`;
    el.dataset.side = 'b';
    return;
  }
  const avail = R.H - top - bottom;
  const cols = [[], []];
  els.forEach((el, i) => cols[i % 2].push(el));
  cols.forEach((col, ci) => {
    if (!col.length) return;
    for (const el of col) { el.style.width = `${R.cw}px`; el.style.maxHeight = `${avail}px`; }
    let hs = col.map((el) => el.offsetHeight);
    let total = hs.reduce((a, b) => a + b, 0) + gap * (col.length - 1);
    if (total > avail) {
      for (const el of col) el.style.maxHeight = `${(avail - gap * (col.length - 1)) / col.length}px`;
      hs = col.map((el) => el.offsetHeight);
      total = hs.reduce((a, b) => a + b, 0) + gap * (col.length - 1);
    }
    let y = top + Math.max(0, (avail - total) / 2);
    col.forEach((el, j) => {
      el.style.top = `${y}px`;
      el.style.left = `${ci === 0 ? 18 : R.W - 18 - R.cw}px`;
      el.dataset.side = ci === 0 ? 'l' : 'r';
      y += hs[j] + gap;
    });
  });
}

// Líneas de cada tarjeta a la pieza (siguen la pieza si se mueve la cámara).
const _v = new THREE.Vector3();
function drawLines() {
  const svg = $('fx-lines');
  if (!focus || !focus.show || focus.region?.narrow) { if (svg.firstChild) svg.innerHTML = ''; return; }
  const W = stage.clientWidth, H = stage.clientHeight;
  const sr = stage.getBoundingClientRect();
  _v.copy(focus.center).project(camera);
  const ax = (_v.x + 1) / 2 * W, ay = (1 - _v.y) / 2 * H;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  _v.copy(focus.center).addScaledVector(right, focus.radius).project(camera);
  const rr = Math.abs((_v.x + 1) / 2 * W - ax);
  let out = `<circle class="halo" cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${(rr * 0.5).toFixed(1)}"/>`;
  for (const el of $('fx-cards').children) {
    if (el.classList.contains('out')) continue;
    const b = el.getBoundingClientRect();
    const left = el.dataset.side === 'l';
    const x1 = (left ? b.right : b.left) - sr.left;
    const y1 = b.top - sr.top + Math.min(24, b.height / 2);
    const xm = x1 + (left ? 22 : -22);
    const ang = Math.atan2(y1 - ay, xm - ax);
    const ex = ax + Math.cos(ang) * rr * 0.5, ey = ay + Math.sin(ang) * rr * 0.5;
    out += `<polyline points="${x1.toFixed(1)},${y1.toFixed(1)} ${xm.toFixed(1)},${y1.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3"/>`;
  }
  svg.innerHTML = out;
}

function renderPager() {
  const s = focus && focus.show;
  const pager = $('pager');
  if (!s || !s.small || s.pages.length < 2) { pager.hidden = true; return; }
  pager.hidden = false;
  pager.innerHTML = s.pages.map((pg, i) => `<button type="button" data-page="${i}" aria-current="${i === s.page}">${esc(pg.name)}<span class="prog"></span></button>`).join('')
    + `<button type="button" class="pause" data-act="pause" aria-pressed="${s.paused}" aria-label="${s.paused ? 'Seguir' : 'Pausar'}" title="${s.paused ? 'Seguir' : 'Pausar'}">${s.paused ? '▶' : '❚❚'}</button>`;
}
$('pager').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  const s = focus && focus.show;
  if (!b || !s) return;
  if (b.dataset.act === 'pause') { s.paused = !s.paused; s.pageT0 = performance.now(); renderPager(); return; }
  goPage(Number(b.dataset.page));
});

// Cambio de enfoque: giro rápido de la pieza y, a mitad del giro, las tarjetas nuevas.
function goPage(i) {
  const s = focus && focus.show;
  if (!s || s.spin || i === s.page) return;
  for (const el of $('fx-cards').children) el.classList.add('out');
  if (reduced) { s.page = i; s.pageT0 = performance.now(); renderCards(); return; }
  s.spin = { t0: performance.now(), dur: 950, to: i, swapped: false };
}

function tickShow(now) {
  const s = focus && focus.show;
  if (!s) return;
  const dt = Math.min(0.1, (now - s.last) / 1000);
  s.last = now;
  if (!reduced) s.angle += dt * 0.35;                      // giro lento
  let extra = 0;
  if (s.spin) {
    const k = Math.min(1, (now - s.spin.t0) / s.spin.dur);
    extra = ease(k) * Math.PI * 2;                         // giro rápido: una vuelta completa
    if (!s.spin.swapped && k >= 0.5) { s.spin.swapped = true; s.page = s.spin.to; renderCards(); }
    if (k >= 1) { s.angle += Math.PI * 2; extra = 0; s.spin = null; s.pageT0 = now; }
  } else if (s.small && s.pages.length > 1 && !s.paused && now - s.pageT0 > PAGE_MS) {
    goPage((s.page + 1) % s.pages.length);
  }
  s.pivot.rotation.y = s.angle + extra;
  const prog = $('pager').querySelector('[aria-current="true"] .prog');
  if (prog) prog.style.width = `${s.spin ? 100 : Math.min(100, ((now - s.pageT0) / PAGE_MS) * 100)}%`;
  drawLines();
}

// Acceso para pruebas, solo con ?debug en la dirección.
if (new URLSearchParams(location.search).has('debug')) window.tm300 = { parts, enterFocus, exitFocus, goPage, get focus() { return focus; }, camera, controls };

// ---------------------------------------------------------------- bucle
renderer.setAnimationLoop((now) => {
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.dur);
    setExplode(anim.from + (anim.to - anim.from) * k);
    if (k >= 1) anim = null;
  }
  if (fly) {
    const k = ease(Math.min(1, (now - fly.t0) / fly.dur));
    controls.target.lerpVectors(fly.ft, fly.tt, k);
    camera.position.lerpVectors(fly.fp, fly.tp, k);
    vo = { x: fly.fo.x + (fly.to.x - fly.fo.x) * k, y: fly.fo.y + (fly.to.y - fly.fo.y) * k };
    applyViewOffset();
    if (k >= 1) fly = null;
  }
  controls.update();
  tickShow(now);
  renderer.render(scene, camera);
});
</script>
