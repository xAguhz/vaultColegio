<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suzuki Swift en 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1f23">
<link rel="icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: escenario 3D a la izquierda, ficha técnica a la derecha (apilado en el celular). */
:root {
  --bg: #e9ecee;
  --panel: #fbfbfa;
  --stage: #dfe3e6;
  --ink: #1b2024;
  --muted: #5a6670;
  --line: #d3d8dc;
  --accent: #a85a12;
  --accent-ink: #ffffff;
  --accent-bg: #f6e6d2;
  --grid: #c3c9ce;
  --chip: #eef0f2;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171a; --panel: #1b1f23; --stage: #101315; --ink: #e5e8eb; --muted: #9ba5ae;
    --line: #2d3339; --accent: #f0a24a; --accent-ink: #1b1206; --accent-bg: #3a2a17;
    --grid: #262c32; --chip: #23292e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171a; --panel: #1b1f23; --stage: #101315; --ink: #e5e8eb; --muted: #9ba5ae;
  --line: #2d3339; --accent: #f0a24a; --accent-ink: #1b1206; --accent-bg: #3a2a17;
  --grid: #262c32; --chip: #23292e; color-scheme: dark;
}
[hidden] { display: none !important; }
.pop { position: absolute; right: 10px; bottom: 112px; z-index: 6; width: min(300px, calc(100% - 20px)); max-height: calc(100% - 170px); overflow-y: auto; padding: 12px 14px; border-radius: 10px; font-size: 13px; }
.pop h4 { margin: 0 0 8px; font-family: var(--font-display); font-size: 17px; letter-spacing: .02em; }
.pop label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
.pop label.sep { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
.pop .capa { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 5px 0; }
.pop .capa small { color: var(--muted); font-family: var(--font-data); font-size: 11px; }
.pop .bar { grid-column: 2 / 4; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.pop .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.hud { position: absolute; left: 10px; top: 10px; z-index: 5; font-family: var(--font-data); font-size: 11px; line-height: 1.45; padding: 6px 9px; border-radius: 8px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); pointer-events: none; white-space: pre; }
.layerbar { position: absolute; left: 50%; transform: translateX(-50%); top: 10px; z-index: 5; padding: 5px 12px; border-radius: 999px; font-family: var(--font-data); font-size: 12px; }
.circ { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 6px; }
.circ b { font-family: var(--font-data); margin-right: 6px; color: var(--accent); }
.circ[aria-current="true"] { border-color: var(--accent); background: var(--accent-bg); }
.group-h { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 6px 0; font-weight: 600; text-align: left; }
.group-h .n { margin-left: auto; color: var(--muted); font-family: var(--font-data); font-size: 12px; font-weight: 400; }
.group-h::after { content: '▾'; color: var(--muted); }
.group.cerrado .group-h::after { content: '▸'; }
.group.cerrado .list { display: none; }
.desmbar { position: absolute; left: 50%; transform: translateX(-50%); top: 52px; z-index: 6; display: flex; gap: 8px; align-items: center; padding: 6px 8px 6px 14px; border-radius: 12px; max-width: calc(100% - 20px); font-size: 13px; }
.desmbar span { flex: 1; }
.tec-tabla td, .tec-tabla th { vertical-align: top; font-size: 12.5px; }
.tec-proc { margin: 0; padding-left: 18px; font-size: 13px; }
.tec-proc li { margin: 2px 0; }
.tec-proc small { color: var(--muted); font-family: var(--font-data); }
.circ-actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 390px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top" "stage panel";
}
.top {
  grid-area: top;
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.01em; margin: 0; line-height: 1.1; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 13px; }
.top .plate { margin-left: auto; font-family: var(--font-data); font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }

.stage { grid-area: stage; position: relative; background: var(--stage); min-height: 0; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-data); color: var(--muted); font-size: 13px; }
.tip {
  position: absolute; pointer-events: none; padding: 4px 8px; border-radius: 4px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  font-size: 12px; font-weight: 500; white-space: nowrap; transform: translate(12px, 12px);
}
.controls {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(6px);
}
.slider { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0; }
.slider label { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: 0.03em; text-transform: uppercase; }
.slider input { flex: 1; min-width: 0; accent-color: var(--accent); }
.slider output { font-family: var(--font-data); font-size: 12px; width: 6ch; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 6px 11px; font-size: 13px; font-weight: 500; line-height: 1.2;
}
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; }

.panel { grid-area: panel; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 12px; gap: 4px; }
.tab {
  border: 0; background: none; padding: 10px 10px 9px; font-family: var(--font-display); font-weight: 600;
  font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { overflow-y: auto; padding: 16px 18px 28px; min-height: 0; flex: 1; }

.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--chip);
  border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; font-weight: 500;
}
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
h2.name { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 10px 0 8px; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
p { margin: 0 0 10px; max-width: 65ch; }
.data { width: 100%; border-collapse: collapse; font-size: 13px; }
.data th, .data td { text-align: left; vertical-align: top; padding: 6px 0; border-bottom: 1px solid var(--line); }
.data th { font-weight: 500; color: var(--muted); width: 42%; padding-right: 10px; }
.data td { font-family: var(--font-data); font-size: 12.5px; }
ul.mant { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.ver { margin-top: 18px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.ver b { color: var(--ink); font-weight: 500; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.thumb { border: 1px solid var(--line); border-radius: 6px; padding: 4px; background: #fff; overflow: hidden; aspect-ratio: 3 / 4; max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
.list { display: grid; gap: 2px; }
.row {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
  padding: 7px 8px; border-radius: 6px; font-size: 13.5px;
}
.row:hover { background: var(--chip); }
.row[aria-current="true"] { background: var(--accent-bg); }
.row .n { margin-left: auto; font-family: var(--font-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.group-h { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 4px; display: flex; align-items: center; gap: 8px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 10px; }
.note { font-size: 12.5px; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 9px 11px; margin-top: 14px; }
.lightbox { position: fixed; inset: 0; background: rgba(10, 12, 14, 0.82); z-index: 20; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.lightbox .lb-bar { display: flex; align-items: center; gap: 10px; color: #f1f3f4; padding-bottom: 8px; }
.lightbox .lb-bar span { flex: 1; font-size: 13px; min-width: 0; }
.lightbox .lb-img { flex: 1; overflow: auto; background: #fff; border-radius: 6px; }
.lightbox img { display: block; max-width: none; width: 100%; min-width: 600px; }

/* ---------- Enfoque de una pieza: botón de volver, modo animación y datos flotantes ---------- */
.glass { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.focus-bar { position: absolute; top: 14px; left: 14px; z-index: 6; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 200px); }
.back {
  display: inline-flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px 0 12px; border-radius: 26px; flex: none;
  font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: 0.04em; text-transform: uppercase;
  box-shadow: 0 4px 18px rgb(0 0 0 / 0.16);
}
.back svg { width: 28px; height: 28px; flex: none; }
.back:hover { border-color: var(--accent); color: var(--accent); }
.focus-name { display: inline-flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 14px 6px 10px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.focus-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mode { position: absolute; top: 14px; right: 14px; z-index: 6; display: inline-flex; align-items: center; gap: 9px; padding: 7px 13px 7px 9px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.mode .sw { width: 32px; height: 18px; border-radius: 9px; background: var(--line); position: relative; transition: background 0.2s; flex: none; }
.mode .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgb(0 0 0 / 0.3); transition: transform 0.2s; }
.mode[aria-pressed="true"] .sw { background: var(--accent); }
.mode[aria-pressed="true"] .sw::after { transform: translateX(14px); }
.stage.focused .controls { display: none; }
.fx { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.fx svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fx polyline { fill: none; stroke: var(--accent); stroke-width: 1.4; opacity: 0.75; }
.fx circle { fill: var(--accent); }
.fx circle.halo { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: 0.45; }
.card {
  position: absolute; pointer-events: auto; overflow: auto; overscroll-behavior: contain; padding: 10px 13px 11px; border-radius: 10px;
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 8px 26px rgb(0 0 0 / 0.16);
  transition: opacity 0.3s ease, transform 0.3s ease; animation: flotar 5s ease-in-out infinite;
}
.card.out { opacity: 0; transform: translateY(10px) scale(0.97); }
@keyframes flotar { 0%, 100% { translate: 0 0; } 50% { translate: 0 -7px; } }
.card .k { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.card .v { font-size: 13.5px; line-height: 1.45; }
.card .v.mono { font-family: var(--font-data); font-size: 13px; }
.card h4 { font-family: var(--font-display); font-weight: 700; font-size: 27px; line-height: 1.05; margin: 4px 0 6px; text-wrap: balance; }
.card p { margin: 0 0 6px; font-size: 13.5px; }
.card .chipline { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--muted); }
.card table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.card th, .card td { text-align: left; vertical-align: top; padding: 4px 0; border-bottom: 1px solid var(--line); }
.card th { font-weight: 500; color: var(--muted); width: 44%; padding-right: 8px; }
.card td { font-family: var(--font-data); }
.card ul { margin: 0; padding-left: 17px; display: grid; gap: 4px; font-size: 13px; }
.card .sec + .sec { margin-top: 10px; }
.card .num { font-family: var(--font-data); color: var(--accent); font-size: 12px; margin-left: 6px; }
.pager { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; display: flex; gap: 3px; padding: 4px; border-radius: 999px; max-width: calc(100% - 20px); }
.pager button { position: relative; overflow: hidden; border: 0; background: none; padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.pager button[aria-current="true"] { background: var(--accent-bg); color: var(--ink); }
.pager .prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent); }
.pager .pause { font-family: var(--font-data); }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 62vh auto; grid-template-rows: auto 62svh auto; grid-template-areas: "top" "stage" "panel"; }
  .btn { min-height: 40px; padding: 8px 13px; }
  .slider input { height: 32px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .pane { overflow: visible; }
  .top .plate { display: none; }
  .controls { left: 8px; right: 8px; bottom: 8px; }
  .focus-bar { top: 10px; left: 10px; max-width: calc(100% - 150px); }
  .back { height: 46px; font-size: 19px; padding: 0 16px 0 10px; }
  .mode { top: 12px; right: 10px; padding: 6px 11px 6px 8px; }
  .focus-name { display: none; }
  .card h4 { font-size: 23px; }
  .pager { bottom: 8px; }
  .pager button { padding: 9px 11px; }
}
/* celular acostado: el visor ocupa casi toda la pantalla; la ficha queda abajo, deslizando */
@media (max-width: 820px) and (orientation: landscape) and (max-height: 500px) {
  .app { grid-template-rows: auto calc(100vh - 52px) auto; grid-template-rows: auto calc(100svh - 52px) auto; }
  .top { padding-top: 8px; padding-bottom: 8px; }
  .top .sub { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .card { animation: none; } }
</style>

<div class="app">
  <header class="top">
    <h1>Suzuki Swift 1.5 XS</h1>
    <span class="sub">Despiece 3D por conjuntos · DBA-ZC21S (Japón, 2008)</span>
    <span class="plate">Motor M15A 1490 cm³ · 4AT · 5 puertas · volante a la derecha</span>
  </header>

  <section class="stage" id="stage" aria-label="Modelo 3D del Suzuki Swift">
    <div class="loading" id="loading">Cargando el modelo…</div>
    <div class="tip" id="tip" hidden></div>
    <div class="fx" id="fx" hidden><svg id="fx-lines" aria-hidden="true"></svg><div id="fx-cards" aria-live="polite"></div></div>
    <div class="focus-bar" id="focus-bar" hidden>
      <button class="back glass" id="btn-back" type="button" aria-label="Volver a la vista anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5"/><path d="M11 5l-7 7 7 7"/></svg>
        Volver
      </button>
      <span class="focus-name glass" id="focus-name"></span>
    </div>
    <button class="mode glass" id="btn-mode" type="button" aria-pressed="true" title="Al tocar una pieza, la muestra girando con sus datos flotando"><span class="sw" aria-hidden="true"></span>Modo animación</button>
    <div class="pager glass" id="pager" hidden></div>
    <div class="pop glass" id="pop-capas" hidden></div>
    <div class="pop glass" id="pop-rend" hidden>
      <h4>Calidad de imagen</h4>
      <label><input type="radio" name="cal" value="alta"> Alta (nítida)</label>
      <label><input type="radio" name="cal" value="media"> Media</label>
      <label><input type="radio" name="cal" value="baja"> Baja (compu lenta)</label>
      <label class="sep"><input type="checkbox" id="chk-fps"> Mostrar cuadros por segundo</label>
      <p class="note" id="rend-info"></p>
    </div>
    <div class="hud" id="hud" hidden></div>
    <div class="layerbar glass" id="layerbar" hidden></div>
    <div class="desmbar glass" id="desmbar" hidden><span id="desm-txt"></span><button class="btn" id="desm-rep" type="button">Repetir</button><button class="btn" id="desm-fin" type="button">Salir</button></div>
    <div class="controls">
      <div class="slider">
        <label for="explode">Despiece</label>
        <input id="explode" type="range" min="0" max="100" value="0" step="1">
        <output id="explode-out" for="explode">0 %</output>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btn-anim" type="button">Despiezar</button>
        <button class="btn" id="btn-color" type="button" aria-pressed="false">Color por conjunto</button>
        <button class="btn" id="btn-cut" type="button" aria-pressed="false">Corte</button>
        <button class="btn" id="btn-xray" type="button" aria-pressed="false" title="Carrocería e interior casi transparentes para ver la mecánica y los cables">Rayos X</button>
        <button class="btn" id="btn-capas" type="button" aria-expanded="false">Capas</button>
        <button class="btn" id="btn-rend" type="button" aria-expanded="false" title="Calidad y cuadros por segundo">Rendimiento</button>
        <button class="btn" id="btn-show" type="button" hidden>Mostrar todo</button>
        <button class="btn" id="btn-home" type="button">Vista inicial</button>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-ficha" aria-selected="true" aria-controls="pane-ficha" type="button">Ficha</button>
      <button class="tab" role="tab" id="tab-piezas" aria-selected="false" aria-controls="pane-piezas" type="button">Piezas</button>
      <button class="tab" role="tab" id="tab-circ" aria-selected="false" aria-controls="pane-circ" type="button">Circuitos</button>
    </div>
    <div class="pane" id="pane-ficha" role="tabpanel" aria-labelledby="tab-ficha"></div>
    <div class="pane" id="pane-circ" role="tabpanel" aria-labelledby="tab-circ" hidden></div>
    <div class="pane" id="pane-piezas" role="tabpanel" aria-labelledby="tab-piezas" hidden>
      <input class="search" id="search" type="search" placeholder="Buscar pieza, código o conjunto" aria-label="Buscar pieza">
      <div id="plist"></div>
    </div>
  </aside>

<script type="importmap">
{ "imports": {

<script type="module">

// En la copia local (app de la compu) el PDF del manual está al lado: los procedimientos abren su página.

let pdfOk = false;
fetch('../../Manual de taller/PDF/disponible.txt', { cache: 'no-store' }).then((r) => { pdfOk = r.ok; if (pdfOk && selected && !focus) renderPart(selected); }).catch(() => {});
const SITIO = 'https://xaguhz.github.io/vaultColegio/vaultSuzuki/';
// Búsqueda acelerada de la pieza bajo el puntero (BVH): si la librería no carga, se usa la búsqueda común.

const CONJ = FICHAS.conjuntos;
const ORDER = Object.keys(CONJ);

// ---------------------------------------------------------------- escena
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
const CALIDAD = { alta: Math.min(devicePixelRatio, 2), media: Math.min(devicePixelRatio, 1), baja: 0.7 };
let calidad = 'alta';

const sun = new THREE.DirectionalLight(0xffffff, 1.4);

const HOME_T = new THREE.Vector3(0.05, 0.62, 0);
const HOME_D = new THREE.Vector3(0.75, 0.42, 1).normalize();
let grid;

// Enfoque de una pieza (aislada y con zoom) y modo animación.
// Diagonal en metros. Por debajo: pieza chica o mediana-chica (mordazas, bobinas, batería, discos…),
// que anima por enfoques. Por encima: mediana-grande o grande (motor, caja, puertas, casco…).
const SMALL = 0.45;

let focus = null;       // { pid, prev, center, radius, region, show }
let vo = { x: 0, y: 0 }; // corrimiento de la vista (para dejar lugar a las tarjetas)
let animMode = true;
try { animMode = localStorage.getItem('swift-anim') !== '0'; } catch (e) { /* sin almacenamiento */ }

  flyTo(HOME_T.clone(), HOME_T.clone().addScaledVector(HOME_D, dist), animate, { x: 0, y: 0 });

// ---------------------------------------------------------------- vuelo de cámara
let fly = null;
function flyTo(target, pos, animate = true, off = vo) {

// ---------------------------------------------------------------- piezas
const parts = new Map();        // pid -> {obj, base, vec, conjunto, nombre, meshes}
const HL = new THREE.Color(cssVar('--accent') || '#f0a24a');

const hidden = new Set();

// El modelo viene como glTF con el binario embebido en base64 (las páginas
// publicadas no sirven .glb). La política de seguridad del visor bloquea que
// GLTFLoader lea ese data:, así que se decodifica acá y se arma un GLB en memoria.
async function loadModelBuffer(url, onProg) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const total = Number(res.headers.get('content-length')) || 0;
  let text;
  if (res.body && total) {
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      if (onProg) onProg(got / total);
      else $('loading').textContent = `Cargando el modelo… ${Math.min(100, Math.round(100 * got / total))} %`;
    }
    text = new TextDecoder().decode(await new Blob(chunks).arrayBuffer());
  } else {
    text = await res.text();
  }
  const doc = JSON.parse(text);
  const uri = doc.buffers[0].uri;
  const b64 = atob(uri.slice(uri.indexOf(',') + 1));
  const bin = new Uint8Array(b64.length);
  for (let i = 0; i < b64.length; i++) bin[i] = b64.charCodeAt(i);
  delete doc.buffers[0].uri;
  doc.buffers[0].byteLength = bin.length;
  const json = new TextEncoder().encode(JSON.stringify(doc));
  const jl = Math.ceil(json.length / 4) * 4, bl = Math.ceil(bin.length / 4) * 4;
  const out = new Uint8Array(12 + 8 + jl + 8 + bl);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, out.length, true);
  dv.setUint32(12, jl, true); dv.setUint32(16, 0x4E4F534A, true);
  out.fill(0x20, 20, 20 + jl); out.set(json, 20);
  dv.setUint32(20 + jl, bl, true); dv.setUint32(24 + jl, 0x004E4942, true);
  out.set(bin, 28 + jl);
  return out.buffer;
}

function modelError(err) {
  console.error(err);
  $('loading').textContent = 'No se pudo cargar el modelo 3D. Recargá la página.';
}

const loader = new GLTFLoader();
// Capas: cada una es un archivo aparte (.glb en GitHub Pages, .json con el binario adentro en los Artifacts).
const USAR_GLB = /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
// En GitHub Pages y en la compu, el visor se puede instalar y usar sin internet (no en los Artifacts).
if (USAR_GLB && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const CAPAS = new Map(MANIF.capas.map((c) => [c.id, { ...c, estado: 'pendiente', visible: c.id !== 'mecanismos', prog: 0 }]));
try {
  const g = JSON.parse(localStorage.getItem('swift-capas') || 'null');
  if (g) for (const [k, v] of Object.entries(g)) if (CAPAS.has(k)) CAPAS.get(k).visible = !!v;
} catch (e) { /* sin almacenamiento */ }
function guardarCapas() { try { localStorage.setItem('swift-capas', JSON.stringify(Object.fromEntries([...CAPAS].map(([k, c]) => [k, c.visible])))); } catch (e) { /* nada */ } }
let primera = true;
async function cargarCapa(id) {
  const c = CAPAS.get(id);
  if (!c || c.estado !== 'pendiente') return;
  c.estado = 'cargando'; renderCapas();
  try {
    let gltf;
    if (USAR_GLB) {
      gltf = await loader.loadAsync(`capas/${id}.glb`, (e) => { if (e.total) { c.prog = e.loaded / e.total; renderCapas(); } });
    } else {
      const buf = await loadModelBuffer(`capas/${id}.json`, (k) => { c.prog = k; renderCapas(); });
      gltf = await new Promise((ok, mal) => loader.parse(buf, '', ok, mal));
    }
    onModel(gltf, id);
    c.estado = 'lista'; c.prog = 1;
  } catch (err) { console.error(err); c.estado = 'error'; }
  renderCapas();
}
(async () => {
  // primero lo que se ve de afuera; después lo de adentro, en segundo plano
  for (const id of ['exterior', 'chasis', 'motor', 'interior', 'electrico', 'mecanismos']) {
    if (!CAPAS.has(id)) continue;
    if (!CAPAS.get(id).visible && id === 'mecanismos') continue;   // se carga al prenderla
    await cargarCapa(id);
  }
  $('layerbar').hidden = true;
})();

function onModel(gltf, capa) {
  scene.add(gltf.scene);
  const nuevos = [];
  gltf.scene.traverse((o) => {
    if (!o.userData || !o.userData.pid || parts.has(o.userData.pid)) return;
    const u = o.userData;
    const e = u.explode || [0, 0, 0];
    const meshes = [];
    o.traverse((m) => {
      if (!m.isMesh) return;
      m.material = m.material.clone();
      m.material.side = THREE.DoubleSide;
      m.userData.orig = m.material.color.clone();
      m.userData.part = u.pid;
      meshes.push(m);
    });
    const p = {
      pid: u.pid, obj: o, nombre: u.nombre, conjunto: u.conjunto, meshes, capa: capa || u.capa,
      base: o.position.clone(), vec: new THREE.Vector3(e[0], e[2], -e[1]),
    };
    parts.set(u.pid, p);
    nuevos.push(p);
    // si ya hay despiece aplicado, la pieza nueva entra en su lugar
    if (explodeT) o.position.copy(p.base).addScaledVector(p.vec, ease(explodeT));
  });
  // índice espacial de cada malla, de a poco para no trabar la pantalla
  if (BVH) {
    const ms = nuevos.flatMap((p) => p.meshes);
    const paso = () => { const t0 = performance.now(); while (ms.length && performance.now() - t0 < 8) { const m = ms.pop(); try { m.geometry.computeBoundsTree(); } catch (e) { /* nada */ } } if (ms.length) setTimeout(paso, 0); };
    setTimeout(paso, 0);
  }
  // tamaño de cada pieza (diagonal de su caja, armada): decide cómo se anima
  gltf.scene.updateMatrixWorld(true);
  for (const p of nuevos) p.size = new THREE.Box3().setFromObject(p.obj).getSize(new THREE.Vector3()).length();
  $('loading').hidden = true;
  remember();
  buildList();
  pickCache = null;
  paint();
  if (primera) {
    primera = false;
    homeView(false);
    updateFocusUi();
    renderOverview();
  } else if (!selected && !focus && !circActivo) renderOverview();
  const h = location.hash.slice(1).replace(/-/g, '_');
  if (h && parts.has(h) && !focus && nuevos.some((p) => p.pid === h)) { capaVisible(parts.get(h).capa, true); enterFocus(h, false); }
  renderCircs();
  invalidate();
}

function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function setExplode(t) {
  explodeT = t;
  const k = ease(t);
  for (const p of parts.values()) p.obj.position.copy(p.base).addScaledVector(p.vec, k);
  $('explode').value = Math.round(t * 100);
  $('explode-out').textContent = `${Math.round(t * 100)} %`;
  $('btn-anim').textContent = t > 0.5 ? 'Armar' : 'Despiezar';
  invalidate();
}
let anim = null;
$('explode').addEventListener('input', (e) => { anim = null; setExplode(e.target.value / 100); });
$('btn-anim').addEventListener('click', () => {
  const to = explodeT > 0.5 ? 0 : 1;
  if (!selected) homeView(true, to);
  if (reduced) { setExplode(to); return; }
  anim = { t0: performance.now(), from: explodeT, to, dur: 1400 };
});

const XRAY = new Set(['exterior', 'interior']);
let xray = false, circActivo = null;
function capaOn(p) { const c = CAPAS.get(p.capa); return !c || c.visible; }
function paint() {
  for (const p of parts.values()) {
    const iso = isolated && isolated.has(p.pid);
    const ghost = (isolated && !iso) || (xray && XRAY.has(p.capa) && !iso);
    const col = colorMode ? new THREE.Color(CONJ[p.conjunto]?.color || '#888') : null;
    const clip = cutOn && !focus;
    for (const m of p.meshes) {
      const mat = m.material;
      mat.color.copy(col || m.userData.orig);
      if (colorMode) { mat.metalness = 0.1; mat.roughness = 0.6; } else { mat.metalness = m.userData.metal ?? mat.metalness; mat.roughness = m.userData.rough ?? mat.roughness; }
      const origT = m.userData.origT ?? (m.userData.origT = mat.transparent);
      const origO = m.userData.origO ?? (m.userData.origO = mat.opacity);
      const quiereT = ghost || origT;
      const op = ghost ? (focus ? 0.05 : (xray && !isolated ? 0.08 : 0.1)) : origO;
      // cambiar transparencia o planos de corte obliga a recompilar el material: solo si cambió
      if (mat.transparent !== quiereT || !!m.userData.clip !== clip) {
        mat.transparent = quiereT;
        mat.clippingPlanes = clip ? cut : [];
        m.userData.clip = clip;
        mat.needsUpdate = true;
      }
      mat.opacity = op;
      mat.depthWrite = !ghost;
      setEmis(m, p.pid);
    }
    p.obj.visible = capaOn(p) && !hidden.has(p.pid) && !(focus && focus.show && focus.pid === p.pid);
  }
  pickCache = null;
  $('btn-show').hidden = !(hidden.size || isolated);
  invalidate();
}
function setEmis(m, pid) {
  const mat = m.material;
  if (!focus && pid === selected) { mat.emissive.copy(HL); mat.emissiveIntensity = 0.55; }
  else if (!focus && pid === hovered) { mat.emissive.copy(HL); mat.emissiveIntensity = 0.22; }
  else { mat.emissive.setRGB(0, 0, 0); mat.emissiveIntensity = 1; }
}
// al pasar el puntero solo se repintan las dos piezas que cambian
function setHover(pid) {
  if (pid === hovered) return;
  const prev = hovered;
  hovered = pid;
  for (const q of [prev, pid]) { const p = q && parts.get(q); if (p) for (const m of p.meshes) setEmis(m, q); }
  invalidate();
}
// guardar metal/rugosidad originales antes de cualquier cambio
function remember() { for (const p of parts.values()) for (const m of p.meshes) { if (m.userData.metal === undefined) { m.userData.metal = m.material.metalness; m.userData.rough = m.material.roughness; } } }

$('btn-color').addEventListener('click', (e) => { colorMode = !colorMode; e.currentTarget.setAttribute('aria-pressed', colorMode); paint(); });
$('btn-cut').addEventListener('click', (e) => { cutOn = !cutOn; e.currentTarget.setAttribute('aria-pressed', cutOn); paint(); });
$('btn-show').addEventListener('click', () => { hidden.clear(); isolated = null; paint(); refresh(); });
$('btn-home').addEventListener('click', () => homeView());

// ---------------------------------------------------------------- selección con el puntero
const ray = new THREE.Raycaster();
let pickCache = null;
const ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (focus && focus.show) return ray.intersectObject(focus.show.clone, true).length ? focus.pid : null;
  if (!pickCache) {
    pickCache = [];
    for (const p of parts.values()) if (p.obj.visible && (!isolated || isolated.has(p.pid)) && !(xray && XRAY.has(p.capa))) pickCache.push(...p.meshes);
  }
  ray.firstHitOnly = !cutOn;
  for (const h of ray.intersectObjects(pickCache, false)) {
    if (cutOn && h.point.z > 0) continue;
    return h.object.userData.part;
  }
  return null;
}
let down = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', (e) => {
  // con el dedo se tolera más movimiento antes de tomarlo como arrastre
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > (e.pointerType === 'mouse' ? 6 : 14)) { down = null; return; }
  down = null;
  const pid = pick(e);
  if (focus) {
    // con una pieza enfocada: tocarla pasa al siguiente enfoque de datos (piezas chicas en modo animación)
    const s = focus.show;
    if (pid && s && s.small && s.pages.length > 1) goPage((s.page + 1) % s.pages.length);
    return;
  }
  if (pid) enterFocus(pid); else { selected = null; paint(); renderOverview(); setHash(''); refreshList(); }
});
let moverPend = null;
cv.addEventListener('pointermove', (e) => {
  if (moverPend) { moverPend = e; return; }
  moverPend = e;
  requestAnimationFrame(() => { const ev = moverPend; moverPend = null; mover(ev); });
});
function mover(e) {
  if (focus) { $('tip').hidden = true; cv.style.cursor = focus.show && pick(e) ? 'pointer' : ''; return; }
  if (e.pointerType !== 'mouse' || e.buttons) { $('tip').hidden = true; return; }
  const pid = pick(e);
  setHover(pid);
  const tip = $('tip');
  if (pid) {
    const r = stage.getBoundingClientRect();
    tip.textContent = parts.get(pid).nombre;
    tip.style.left = `${e.clientX - r.left}px`;
    tip.style.top = `${e.clientY - r.top}px`;
    tip.hidden = false;
    cv.style.cursor = 'pointer';
  } else { tip.hidden = true; cv.style.cursor = ''; }
}
cv.addEventListener('pointerleave', () => { $('tip').hidden = true; setHover(null); });
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('lightbox').hidden) { closeLightbox(); return; }
  if (desm) { salirDesm(); return; }
  if (focus) { exitFocus(); return; }
  if (selected) { selected = null; paint(); renderOverview(); setHash(''); refreshList(); }
});

function focusOn(pid) {
  const p = parts.get(pid);
  const box = new THREE.Box3().setFromObject(p.obj);
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = Math.min(4, Math.max(0.5, size * 2.2)) * Math.max(1, 1.2 / camera.aspect);
  flyTo(c, c.clone().addScaledVector(dir, dist));
}
function setHash(h) { try { history.replaceState(null, '', h ? `#${h.replace(/_/g, '-')}` : location.pathname + location.search); } catch (e) { /* sin historial */ } }

// Elegir una pieza (en el modelo, la lista o la ficha) siempre la enfoca: aislada y con zoom.
function select(pid) { enterFocus(pid); }

// ---------------------------------------------------------------- panel
function showTab(t) {
  for (const n of ['ficha', 'piezas', 'circ']) {
    $(`tab-${n}`).setAttribute('aria-selected', n === t);
    $(`pane-${n}`).hidden = n !== t;
  }
}
$('tab-ficha').addEventListener('click', () => showTab('ficha'));
$('tab-piezas').addEventListener('click', () => showTab('piezas'));
$('tab-circ').addEventListener('click', () => showTab('circ'));

function chip(conj) {
  return `<button class="chip" type="button" data-conj="${esc(conj)}"><span class="dot" style="background:${CONJ[conj]?.color}"></span>${esc(conj)}</button>`;
}
function laminas(conj) {
  const ls = CONJ[conj]?.laminas || [];
  if (!ls.length) return '';
  return `<h3>Láminas del modelo</h3><div class="thumbs">${ls.map(([f, cap]) =>
    `<button class="thumb" type="button" data-img="${esc(f)}" data-cap="${esc(cap)}" title="${esc(cap)}"><img loading="lazy" alt="${esc(cap)}" src="laminas/${esc(f)}" data-fallback="../../Adjuntos/Suzuki Swift/${esc(f)}"></button>`).join('')}</div>`;
}
function partsOf(conj) { return [...parts.values()].filter((p) => p.conjunto === conj); }

function renderOverview() {
  const counts = ORDER.filter((c) => partsOf(c).length).map((c) => `<button class="row" type="button" data-conj="${esc(c)}"><span class="dot" style="background:${CONJ[c].color}"></span>${esc(c)}<span class="n">${partsOf(c).length}</span></button>`).join('');
  $('pane-ficha').innerHTML = `
    <span class="chip"><span class="dot" style="background:var(--accent)"></span>Vista general</span>

    <p>Con el <b>Modo animación</b> activado, la pieza elegida gira con sus datos flotando alrededor. Las piezas chicas cambian de enfoque (identificación, características, mantenimiento) con un giro rápido; las grandes muestran todo junto.</p>
    <h3>Ficha técnica (1.5XS, DBA-ZC21S)</h3>
    <table class="data"><tbody>
      <tr><th>Largo × ancho × alto</th><td>3755 × 1690 × 1510 mm</td></tr>
      <tr><th>Distancia entre ejes</th><td>2390 mm</td></tr>
      <tr><th>Peso</th><td>1030 kg</td></tr>

      <tr><th>Caja</th><td>Automática de 4 marchas · tracción delantera</td></tr>
      <tr><th>Suspensión</th><td>McPherson / eje de torsión</td></tr>
      <tr><th>Frenos</th><td>Discos ventilados / tambores · ABS</td></tr>
      <tr><th>Neumáticos</th><td>185/60R15 84H</td></tr>

}

function renderConj(conj) {
  const c = CONJ[conj];
  const ps = partsOf(conj).map((p) => `<button class="row" type="button" data-pid="${p.pid}"${p.pid === selected ? ' aria-current="true"' : ''}>${esc(p.nombre)}</button>`).join('');
  $('pane-ficha').innerHTML = `
    ${chip(conj)}
    <h2 class="name">${esc(conj)}</h2>
    <p>${esc(c.resumen)}</p>
    <div class="btn-row"><button class="btn" type="button" data-act="iso-conj" data-conj="${esc(conj)}">Aislar conjunto</button></div>
    <h3>Piezas</h3><div class="list">${ps}</div>
    ${laminas(conj)}
    <p class="ver">En el vault: <b>${esc(c.nota)}</b></p>`;
}

function renderPart(pid) {
  const p = parts.get(pid);
  const f = FICHAS.piezas[pid] || {};
  const datos = (f.datos || []).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
  const mant = (f.mant || []).map((m) => `<li>${esc(m)}</li>`).join('');
  $('pane-ficha').innerHTML = `
    ${chip(p.conjunto)}
    <h2 class="name">${esc(p.nombre)}</h2>
    <div class="btn-row">
      <button class="btn" type="button" data-act="focus">Centrar</button>
      ${focus ? '<button class="btn" type="button" data-act="back">← Volver</button>' : `
      <button class="btn" type="button" data-act="iso" aria-pressed="${!!(isolated && isolated.size === 1 && isolated.has(pid))}">Aislar</button>
      <button class="btn" type="button" data-act="hide">Ocultar</button>`}
    </div>
    ${f.que ? `<h3>Qué es</h3><p>${esc(f.que)}</p>` : ''}
    ${datos ? `<h3>Datos</h3><table class="data"><tbody>${datos}</tbody></table>` : ''}
    ${mant ? `<h3>Mantenimiento</h3><ul class="mant">${mant}</ul>` : ''}
    ${laminas(p.conjunto)}
    ${f.ver ? `<p class="ver">Más en el vault: <b>${esc(f.ver)}</b></p>` : ''}
    ${tecnicaHtml(pid)}
    ${circsDe(pid)}`;
}

$('pane-ficha').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.pid) { select(b.dataset.pid); return; }
  if (b.dataset.img) { openLightbox(b.dataset.img, b.dataset.cap); return; }
  const act = b.dataset.act;
  if (act === 'focus' && focus) fitFocus();
  else if (act === 'focus' && selected) focusOn(selected);
  else if (act === 'back') exitFocus();
  else if (act === 'iso' && selected) {
    isolated = isolated && isolated.size === 1 && isolated.has(selected) ? null : new Set([selected]);
    paint(); renderPart(selected);
  } else if (act === 'hide' && selected) {
    hidden.add(selected); selected = null; paint(); renderOverview(); setHash(''); refreshList();
  } else if (act === 'iso-conj') {
    isolated = new Set(partsOf(b.dataset.conj).map((p) => p.pid)); paint();
  } else if (b.dataset.conj) {
    renderConj(b.dataset.conj);
  }
});
$('pane-ficha').addEventListener('error', (e) => {
  const img = e.target;
  if (img.tagName === 'IMG' && img.dataset.fallback && img.src.indexOf('Adjuntos') < 0) img.src = img.dataset.fallback;
}, true);

function refresh() { if (selected) renderPart(selected); else renderOverview(); }

// ---------------------------------------------------------------- lista de piezas
function buildList() {
  $('plist').innerHTML = ORDER.filter((c) => partsOf(c).length).map((c) => `
    <div class="group cerrado" data-group="${esc(c)}">
      <button class="group-h" type="button" aria-expanded="false"><span class="dot" style="background:${CONJ[c].color}"></span>${esc(c)}<span class="n">${partsOf(c).length}</span></button>
      <div class="list">${partsOf(c).map((p) => `<button class="row" type="button" data-pid="${p.pid}" data-q="${esc((p.nombre + ' ' + c + ' ' + (FICHAS.piezas[p.pid]?.datos || []).map((d) => d[1]).join(' ')).toLowerCase())}">${esc(p.nombre)}</button>`).join('')}</div>
    </div>`).join('');
}
function refreshList() {
  for (const r of $('plist').querySelectorAll('.row')) r.setAttribute('aria-current', r.dataset.pid === selected);
}
$('plist').addEventListener('click', (e) => {
  const h = e.target.closest('.group-h');
  if (h) { const g = h.parentElement; g.classList.toggle('cerrado'); h.setAttribute('aria-expanded', !g.classList.contains('cerrado')); return; }

$('search').addEventListener('input', (e) => {

    let any = false;
    for (const r of g.querySelectorAll('.row')) { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; any = any || ok; }
    g.hidden = !any;

// ---------------------------------------------------------------- láminas ampliadas
function openLightbox(f, cap) {
  const img = $('lb-img');
  img.onerror = () => { img.onerror = null; img.src = `../../Adjuntos/Suzuki Swift/${f}`; };
  img.src = `laminas/${f}`;
  img.alt = cap;
  $('lb-cap').textContent = cap;
  $('lightbox').hidden = false;
  $('lb-close').focus();
}
function closeLightbox() { $('lightbox').hidden = true; }
$('lb-close').addEventListener('click', closeLightbox);
$('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });

// ---------------------------------------------------------------- enfoque de una pieza
function enterFocus(pid, animate = true) {
  if (!parts.has(pid)) return;
  if (!focus) {
    focus = { prev: { pos: camera.position.clone(), target: controls.target.clone(), off: { ...vo }, isolated, selected } };
    anim = null;
  } else clearShow();
  focus.pid = pid;
  selected = pid;
  isolated = new Set([pid]);
  hovered = null;
  $('tip').hidden = true;
  stage.classList.add('focused');
  controls.minDistance = 0.04;
  controls.maxDistance = 20;
  camera.near = 0.01;
  if (animMode) startShow(pid);
  paint();
  renderPart(pid);
  setHash(pid);
  showTab('ficha');
  refreshList();
  updateFocusUi();
  fitFocus(animate);
  if (focus.show) renderCards();
}

function exitFocus() {
  if (!focus) return;
  const prev = focus.prev;
  clearShow();
  focus = null;
  stage.classList.remove('focused');
  controls.minDistance = 0.35;
  controls.maxDistance = 16;
  camera.near = 0.05;
  isolated = prev.isolated;
  selected = prev.selected;
  paint();
  refresh();
  setHash(selected || '');
  refreshList();
  updateFocusUi();
  flyTo(prev.target, prev.pos, true, prev.off);
}
$('btn-back').addEventListener('click', exitFocus);

function cardW(W) { return Math.round(Math.min(290, Math.max(200, W * 0.24))); }
// Zona de la pantalla donde va la pieza (el resto queda para las tarjetas y los botones).
function focusRegion() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const cw = cardW(W);
  const narrow = W < 640 || W - 2 * (cw + 40) < 240;
  const side = !narrow && H < 460; // pantalla baja (celular acostado): una sola tarjeta a la derecha
  if (!focus || !focus.show) return { W, H, narrow, cw, cx: W / 2, cy: H / 2 + 22, rw: W - 60, rh: H - 150 };
  if (narrow) return { W, H, narrow, merged: true, cw, cx: W / 2, cy: H * 0.29, rw: W - 40, rh: H * 0.4 };
  if (side) {
    const sw = Math.round(Math.min(360, W * 0.42));
    return { W, H, narrow, side, merged: true, cw: sw, cx: (W - sw - 28) / 2, cy: H / 2 + 14, rw: W - sw - 80, rh: H - 120 };
  }
  return { W, H, narrow, cw, cx: W / 2, cy: H / 2 + 6, rw: W - 2 * (cw + 40), rh: H - 170 };
}

function fitFocus(animate = true) {
  if (!focus) return;
  const p = parts.get(focus.pid);
  const sph = new THREE.Box3().setFromObject(p.obj).getBoundingSphere(new THREE.Sphere());
  focus.center = sph.center.clone();
  focus.radius = sph.radius;
  const R = focusRegion();
  focus.region = R;
  const rpx = 0.46 * Math.min(R.rw, R.rh);                 // radio de la pieza en pantalla
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(0.08, sph.radius * R.H / (2 * rpx * tanH));
  const dir = camera.position.clone().sub(controls.target);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(-0.45, 0, 1);
  dir.normalize();
  dir.y = 0.45;
  dir.normalize();
  flyTo(sph.center.clone(), sph.center.clone().addScaledVector(dir, d), animate, { x: R.W / 2 - R.cx, y: R.H / 2 - R.cy });
}

function updateFocusUi() {
  $('focus-bar').hidden = !focus;
  $('btn-mode').setAttribute('aria-pressed', animMode);
  const name = $('focus-name');
  name.hidden = !focus || !!(focus && focus.show);
  if (focus) {
    const p = parts.get(focus.pid);
    name.innerHTML = `<span class="dot" style="background:${CONJ[p.conjunto]?.color}"></span><span>${esc(p.nombre)}</span>`;
  }
  const s = focus && focus.show;
  $('fx').hidden = !s;
  $('pager').hidden = !(s && s.small && s.pages.length > 1);
}

$('btn-mode').addEventListener('click', () => {
  animMode = !animMode;
  try { localStorage.setItem('swift-anim', animMode ? '1' : '0'); } catch (e) { /* sin almacenamiento */ }
  if (focus) {
    if (animMode) startShow(focus.pid); else clearShow();
    paint();
    updateFocusUi();
    fitFocus(true);
    if (focus.show) renderCards();
  } else updateFocusUi();
});

// ---------------------------------------------------------------- modo animación
function startShow(pid) {
  const p = parts.get(pid);
  p.obj.updateWorldMatrix(true, true);
  const center = new THREE.Box3().setFromObject(p.obj).getBoundingSphere(new THREE.Sphere()).center;
  const pivot = new THREE.Group();
  pivot.position.copy(center);
  const clone = p.obj.clone(true);
  p.obj.matrixWorld.decompose(clone.position, clone.quaternion, clone.scale);
  clone.position.sub(center);
  const mats = [];
  clone.traverse((m) => {
    if (!m.isMesh) return;
    m.material = m.material.clone();
    m.material.emissive.set(0x000000);
    m.material.transparent = false;
    m.material.opacity = 1;
    m.material.depthWrite = true;
    m.material.clippingPlanes = [];
    mats.push(m.material);
  });
  pivot.add(clone);
  scene.add(pivot);
  const small = p.size < SMALL;
  const now = performance.now();
  focus.show = { pivot, clone, mats, small, pages: buildPages(pid, small), page: 0, angle: 0, last: now, pageT0: now, spin: null, paused: false };
  renderPager();
}

function clearShow() {
  const s = focus && focus.show;
  if (!s) return;
  scene.remove(s.pivot);
  for (const m of s.mats) m.dispose();
  focus.show = null;
  $('fx-cards').innerHTML = '';
  $('fx-lines').innerHTML = '';
}

// Las "páginas" de datos de una pieza: cada una es un enfoque distinto.
function buildPages(pid, small) {
  const p = parts.get(pid);
  const f = FICHAS.piezas[pid] || {};
  const conj = { name: p.conjunto, color: CONJ[p.conjunto]?.color || '#888' };
  const datos = (f.datos || []).map(([k, v]) => ({ k, v, mono: true }));
  const mant = (f.mant || []).map((m, i, a) => ({ k: 'Mantenimiento', num: `${i + 1}/${a.length}`, v: m }));
  const title = { title: true, conj, nombre: p.nombre, sub: small ? '' : (f.que || '') };
  if (!small) {
    const cards = [title];
    if (datos.length) cards.push({ k: 'Características', table: datos });
    if (mant.length) cards.push({ k: 'Mantenimiento', list: mant.map((m) => m.v) });
    if (TEC[pid]?.fallas) cards.push({ k: 'Fallas típicas', list: TEC[pid].fallas.slice(0, 3).map(([a, b]) => `${a} → ${b}`) });
    if (f.ver) cards.push({ k: 'En el vault', v: f.ver });
    return [{ name: 'Todo', cards }];
  }
  const pages = [{ name: 'Identificación', cards: [title, f.que ? { k: 'Qué es', v: f.que } : null, f.ver ? { k: 'En el vault', v: f.ver } : null].filter(Boolean) }];
  if (datos.length) pages.push({ name: 'Características', cards: datos });
  if (mant.length) pages.push({ name: 'Mantenimiento', cards: mant });
  if (TEC[pid]?.fallas) pages.push({ name: 'Fallas', cards: TEC[pid].fallas.map(([a, b, c], i, arr) => ({ k: 'Falla', num: `${i + 1}/${arr.length}`, v: `${a}: ${b}. ${c}` })) });
  return pages;
}

function cardHtml(c) {
  if (c.title) return `<div class="chipline"><span class="dot" style="background:${c.conj.color}"></span>${esc(c.conj.name)}</div><h4>${esc(c.nombre)}</h4>${c.sub ? `<p>${esc(c.sub)}</p>` : ''}`;
  let body = '';
  if (c.table) body = `<table><tbody>${c.table.map((d) => `<tr><th>${esc(d.k)}</th><td>${esc(d.v)}</td></tr>`).join('')}</tbody></table>`;
  else if (c.list) body = `<ul>${c.list.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
  else body = `<div class="v${c.mono ? ' mono' : ''}">${esc(c.v)}</div>`;
  return `<div class="k">${esc(c.k)}${c.num ? `<span class="num">${c.num}</span>` : ''}</div>${body}`;
}

// En pantallas angostas, todas las tarjetas de la página van juntas en una sola, abajo.
function mergedHtml(page) {
  const out = [];
  const datos = [], mant = [];
  for (const c of page.cards) {
    if (c.title) out.push(cardHtml(c));
    else if (c.mono) datos.push(c);
    else if (c.k === 'Mantenimiento' && !c.list) mant.push(c.v);
    else out.push(`<div class="sec">${cardHtml(c)}</div>`);
  }
  if (datos.length) out.push(`<div class="sec">${cardHtml({ k: 'Características', table: datos })}</div>`);
  if (mant.length) out.push(`<div class="sec">${cardHtml({ k: 'Mantenimiento', list: mant })}</div>`);
  return out.join('');
}

function renderCards() {
  const s = focus && focus.show;
  if (!s) return;
  const R = focusRegion();
  const box = $('fx-cards');
  const page = s.pages[s.page];
  const htmls = R.merged ? [mergedHtml(page)] : page.cards.map(cardHtml);
  box.innerHTML = '';
  htmls.forEach((h, i) => {
    const el = document.createElement('div');
    el.className = 'card out';
    el.innerHTML = h;
    el.style.animationDuration = `${4.4 + (i % 3) * 0.8}s`;
    el.style.animationDelay = `${-i * 1.3}s`;
    box.appendChild(el);
  });
  layoutCards();
  requestAnimationFrame(() => [...box.children].forEach((el, i) => setTimeout(() => el.classList.remove('out'), reduced ? 0 : 90 * i)));
  renderPager();
}

function layoutCards() {
  const s = focus && focus.show;
  if (!s) return;
  const R = focusRegion();
  const els = [...$('fx-cards').children];
  const top = 82, bottom = s.small && s.pages.length > 1 ? 66 : 18, gap = 14;
  $('pager').style.left = R.side ? `${R.cx}px` : ''; // acostado: la botonera va debajo de la pieza
  if (R.narrow) {
    const el = els[0];
    if (!el) return;
    el.style.left = '10px';
    el.style.width = `${R.W - 20}px`;
    el.style.maxHeight = `${Math.max(120, R.H * 0.5 - bottom)}px`;
    el.style.top = `${R.H - bottom - el.offsetHeight}px`;
    el.dataset.side = 'b';
    return;
  }
  if (R.side) {
    const el = els[0];
    if (!el) return;
    const t = 60;
    el.style.width = `${R.cw}px`;
    el.style.left = `${R.W - 14 - R.cw}px`;
    el.style.maxHeight = `${R.H - t - 14}px`;
    el.style.top = `${t}px`;
    el.dataset.side = 'r';
    return;
  }
  const avail = R.H - top - bottom;
  const cols = [[], []];
  els.forEach((el, i) => cols[i % 2].push(el));
  cols.forEach((col, ci) => {
    if (!col.length) return;
    for (const el of col) { el.style.width = `${R.cw}px`; el.style.maxHeight = `${avail}px`; }
    let hs = col.map((el) => el.offsetHeight);
    let total = hs.reduce((a, b) => a + b, 0) + gap * (col.length - 1);
    if (total > avail) {
      for (const el of col) el.style.maxHeight = `${(avail - gap * (col.length - 1)) / col.length}px`;
      hs = col.map((el) => el.offsetHeight);
      total = hs.reduce((a, b) => a + b, 0) + gap * (col.length - 1);
    }
    let y = top + Math.max(0, (avail - total) / 2);
    col.forEach((el, j) => {
      el.style.top = `${y}px`;
      el.style.left = `${ci === 0 ? 18 : R.W - 18 - R.cw}px`;
      el.dataset.side = ci === 0 ? 'l' : 'r';
      y += hs[j] + gap;
    });
  });
}

// Líneas de cada tarjeta a la pieza (siguen la pieza si se mueve la cámara).
const _v = new THREE.Vector3();
function drawLines() {
  const svg = $('fx-lines');
  if (!focus || !focus.show || focus.region?.narrow) { if (svg.firstChild) svg.innerHTML = ''; return; }
  const W = stage.clientWidth, H = stage.clientHeight;
  const sr = stage.getBoundingClientRect();
  _v.copy(focus.center).project(camera);
  const ax = (_v.x + 1) / 2 * W, ay = (1 - _v.y) / 2 * H;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  _v.copy(focus.center).addScaledVector(right, focus.radius).project(camera);
  const rr = Math.abs((_v.x + 1) / 2 * W - ax);
  let out = `<circle class="halo" cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${(rr * 0.5).toFixed(1)}"/>`;
  for (const el of $('fx-cards').children) {
    if (el.classList.contains('out')) continue;
    const b = el.getBoundingClientRect();
    const left = el.dataset.side === 'l';
    const x1 = (left ? b.right : b.left) - sr.left;
    const y1 = b.top - sr.top + Math.min(24, b.height / 2);
    const xm = x1 + (left ? 22 : -22);
    const ang = Math.atan2(y1 - ay, xm - ax);
    const ex = ax + Math.cos(ang) * rr * 0.5, ey = ay + Math.sin(ang) * rr * 0.5;
    out += `<polyline points="${x1.toFixed(1)},${y1.toFixed(1)} ${xm.toFixed(1)},${y1.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3"/>`;
  }
  svg.innerHTML = out;
}

function renderPager() {
  const s = focus && focus.show;
  const pager = $('pager');
  if (!s || !s.small || s.pages.length < 2) { pager.hidden = true; return; }
  pager.hidden = false;
  pager.innerHTML = s.pages.map((pg, i) => `<button type="button" data-page="${i}" aria-current="${i === s.page}">${esc(pg.name)}<span class="prog"></span></button>`).join('')
    + `<button type="button" class="pause" data-act="pause" aria-pressed="${s.paused}" aria-label="${s.paused ? 'Seguir' : 'Pausar'}" title="${s.paused ? 'Seguir' : 'Pausar'}">${s.paused ? '▶' : '❚❚'}</button>`;
}
$('pager').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  const s = focus && focus.show;
  if (!b || !s) return;
  if (b.dataset.act === 'pause') { s.paused = !s.paused; s.pageT0 = performance.now(); renderPager(); return; }
  goPage(Number(b.dataset.page));
});

// Cambio de enfoque: giro rápido de la pieza y, a mitad del giro, las tarjetas nuevas.
function goPage(i) {
  const s = focus && focus.show;
  if (!s || s.spin || i === s.page) return;
  for (const el of $('fx-cards').children) el.classList.add('out');
  if (reduced) { s.page = i; s.pageT0 = performance.now(); renderCards(); return; }
  s.spin = { t0: performance.now(), dur: 950, to: i, swapped: false };
}

function tickShow(now) {
  const s = focus && focus.show;
  if (!s) return;
  const dt = Math.min(0.1, (now - s.last) / 1000);
  s.last = now;
  if (!reduced) s.angle += dt * 0.35;                      // giro lento
  let extra = 0;
  if (s.spin) {
    const k = Math.min(1, (now - s.spin.t0) / s.spin.dur);
    extra = ease(k) * Math.PI * 2;                         // giro rápido: una vuelta completa
    if (!s.spin.swapped && k >= 0.5) { s.spin.swapped = true; s.page = s.spin.to; renderCards(); }
    if (k >= 1) { s.angle += Math.PI * 2; extra = 0; s.spin = null; s.pageT0 = now; }
  } else if (s.small && s.pages.length > 1 && !s.paused && now - s.pageT0 > PAGE_MS) {
    goPage((s.page + 1) % s.pages.length);
  }
  s.pivot.rotation.y = s.angle + extra;
  const prog = $('pager').querySelector('[aria-current="true"] .prog');
  if (prog) prog.style.width = `${s.spin ? 100 : Math.min(100, ((now - s.pageT0) / PAGE_MS) * 100)}%`;
  drawLines();
}

// Acceso para pruebas, solo con ?debug en la dirección.
if (new URLSearchParams(location.search).has('debug')) window.swift = { parts, enterFocus, exitFocus, goPage, get focus() { return focus; }, camera, controls, renderer, CAPAS, capaVisible, verCircuito, invalidate, setExplode, desmontar, salirDesm, paso: (ms) => tickDesm(performance.now() + ms), get desm() { return desm; }, get dirty() { return dirty; } };

// ---------------------------------------------------------------- capas
function capaVisible(id, on) {
  const c = CAPAS.get(id);
  if (!c) return;
  c.visible = on;
  if (on && c.estado === 'pendiente') cargarCapa(id);
  guardarCapas(); paint(); renderCapas();
}
function renderCapas() {
  const filas = [...CAPAS.values()].map((c) => {
    const est = c.estado === 'lista' ? `${c.piezas} piezas` : c.estado === 'cargando' ? `${Math.round(c.prog * 100)} %` : c.estado === 'error' ? 'error' : 'sin cargar';
    return `<label class="capa"><input type="checkbox" data-capa="${c.id}" ${c.visible ? 'checked' : ''}><span>${esc(c.titulo)}<br><small>${esc(c.conjuntos.join(' · '))}</small></span><small>${est}</small>
      ${c.estado === 'cargando' ? `<span class="bar"><i style="width:${Math.round(c.prog * 100)}%"></i></span>` : ''}</label>`;
  }).join('');
  $('pop-capas').innerHTML = `<h4>Capas del modelo</h4>${filas}<p class="note">Apagar capas que no se usan aliviana el dibujo. "Por dentro" (motor y caja por dentro) se carga al prenderla.</p>`;
  const carg = [...CAPAS.values()].filter((c) => c.estado === 'cargando');
  $('layerbar').hidden = !carg.length;
  if (carg.length) $('layerbar').textContent = `Cargando ${carg.map((c) => c.titulo.toLowerCase()).join(', ')}… ${Math.round(100 * carg[0].prog)} %`;
}
$('pop-capas').addEventListener('change', (e) => { const i = e.target.closest('[data-capa]'); if (i) capaVisible(i.dataset.capa, i.checked); });
function togglePop(id, btn) {
  for (const k of ['pop-capas', 'pop-rend']) if (k !== id) { $(k).hidden = true; }
  $(id).hidden = !$(id).hidden;
  for (const b of ['btn-capas', 'btn-rend']) $(b).setAttribute('aria-expanded', !$(b === 'btn-capas' ? 'pop-capas' : 'pop-rend').hidden);
}
$('btn-capas').addEventListener('click', () => { renderCapas(); togglePop('pop-capas'); });
$('btn-rend').addEventListener('click', () => { renderRend(); togglePop('pop-rend'); });
$('btn-xray').addEventListener('click', (e) => { xray = !xray; e.currentTarget.setAttribute('aria-pressed', xray); paint(); });
renderCapas();

// ---------------------------------------------------------------- rendimiento
let cuadros = 0, hudT = performance.now(), fpsOn = false;
try { fpsOn = localStorage.getItem('swift-fps') === '1'; } catch (e) { /* nada */ }
$('chk-fps').checked = fpsOn;
$('hud').hidden = !fpsOn;
function renderRend() {
  for (const r of document.querySelectorAll('input[name="cal"]')) r.checked = r.value === calidad;
  const gl = renderer.getContext();
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'GPU';
  const tris = [...CAPAS.values()].filter((c) => c.estado === 'lista').reduce((a, c) => a + c.triangulos, 0);
  $('rend-info').textContent = `${gpu} · ${(renderer.getPixelRatio() * 100).toFixed(0)} % de resolución · ${parts.size} piezas y ${(tris / 1000).toFixed(0)} mil triángulos cargados. Solo se dibuja cuando algo se mueve.`;
}
document.querySelectorAll('input[name="cal"]').forEach((r) => r.addEventListener('change', () => {
  calidad = r.value;
  try { localStorage.setItem('swift-calidad', calidad); } catch (e) { /* nada */ }
  renderer.setPixelRatio(CALIDAD[calidad]); resize(); renderRend();
}));
$('chk-fps').addEventListener('change', (e) => { fpsOn = e.target.checked; $('hud').hidden = !fpsOn; try { localStorage.setItem('swift-fps', fpsOn ? '1' : '0'); } catch (er) { /* nada */ } });
function hudTick(now) {
  if (!fpsOn || now - hudT < 500) return;
  const dt = (now - hudT) / 1000;
  const i = renderer.info.render;
  $('hud').textContent = `${Math.round(cuadros / dt)} cuadros/s dibujados${cuadros ? '' : ' (quieto)'}\n${i.calls} llamadas · ${(i.triangles / 1000).toFixed(0)} mil triáng.\n${(renderer.info.memory.geometries)} geometrías`;
  cuadros = 0; hudT = now;
}

// ---------------------------------------------------------------- circuitos
function tecnicaHtml(pid) {
  const t = TEC[pid];
  if (!t) return '';
  const nom = (q) => parts.get(q)?.nombre || q;
  let h = '';
  if (t.fallas) h += `<h3>Fallas típicas</h3><table class="data tec-tabla"><thead><tr><th>Síntoma</th><th>Causa y qué hacer</th></tr></thead><tbody>${t.fallas.map(([a, b, c]) => `<tr><th>${esc(a)}</th><td><b>${esc(b)}.</b> ${esc(c)}</td></tr>`).join('')}</tbody></table>`;
  if (t.desmontaje) {
    const d = t.desmontaje;
    h += `<h3>Cómo se desmonta</h3>${d.antes.length ? `<p class="note">Antes hay que sacar: ${d.antes.map((q) => `<button class="chip" type="button" data-pid="${q}">${esc(nom(q))}</button>`).join(' ')}</p>` : ''}
      <ol class="mant">${d.pasos.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>
      ${d.antes.length ? `<div class="btn-row"><button class="btn primary" type="button" data-desm="${pid}">Desmontaje animado</button></div>` : ''}`;
  }
  if (t.procedimientos) h += `<h3>En el manual de taller</h3><ul class="tec-proc">${t.procedimientos.map(([n, p]) => `<li>${pdfOk ? `<a href="${PDF_URL}#page=${p}" target="_blank" rel="noopener">${esc(n)}</a>` : esc(n)} <small>pág. ${p}</small></li>`).join('')}</ul>${pdfOk ? '' : '<p class="note">Las páginas abren el PDF en la app de la compu (el PDF no se publica).</p>'}`;
  if (t.pares) h += `<h3>Pares de apriete</h3><table class="data"><tbody>${t.pares.map(([n, v]) => `<tr><th>${esc(n)}</th><td>${esc(v)} N·m</td></tr>`).join('')}</tbody></table>`;
  if (t.herramientas) h += `<h3>Herramientas especiales</h3><p>${t.herramientas.map((x) => `<code>${esc(x)}</code>`).join(' ')}</p>`;
  return h;
}

// ---------------------------------------------------------------- desmontaje animado
let desm = null;
function desmontar(pid) {
  const t = TEC[pid]?.desmontaje;
  if (!t || !parts.has(pid)) return;
  if (focus) exitFocus();
  circActivo = null;
  const lista = t.antes.filter((q) => parts.has(q));
  for (const q of [...lista, pid]) { const c = CAPAS.get(parts.get(q).capa); if (c && !c.visible) capaVisible(c.id, true); }
  hidden.clear();
  isolated = new Set([...lista, pid]);
  selected = pid;
  setExplode(0);
  paint();
  const box = new THREE.Box3();
  for (const q of isolated) box.expandByObject(parts.get(q).obj);
  const ctr = box.getCenter(new THREE.Vector3());
  const r = Math.max(0.5, box.getSize(new THREE.Vector3()).length() * 0.7);
  const dir = camera.position.clone().sub(controls.target).normalize();
  flyTo(ctr, ctr.clone().addScaledVector(dir, r / Math.sin((camera.fov * Math.PI) / 360)), true, { x: 0, y: 0 });
  desm = { pid, lista, i: 0, t0: performance.now() + 900, fin: false };
  $('desmbar').hidden = false;
  textoDesm();
}
function textoDesm() {
  const d = desm;
  if (!d) return;
  $('desm-txt').textContent = d.fin ? `Listo: ya se puede sacar ${parts.get(d.pid).nombre}. Los pasos están en la ficha.`
    : `Paso ${d.i + 1} de ${d.lista.length}: sacar ${parts.get(d.lista[d.i]).nombre}`;
}
function tickDesm(now) {
  const d = desm;
  if (!d || d.fin || now < d.t0) return;
  const p = parts.get(d.lista[d.i]);
  const k = Math.min(1, (now - d.t0) / 1100);
  const v = p.vec.lengthSq() > 0.01 ? p.vec : new THREE.Vector3(0, 0.8, 0);
  p.obj.position.copy(p.base).addScaledVector(v, ease(k) * 1.3);
  for (const m of p.meshes) { m.material.emissive.copy(HL); m.material.emissiveIntensity = 0.45 * (1 - k); }
  if (k >= 1) {
    for (const m of p.meshes) setEmis(m, p.pid);
    p.obj.visible = false;
    d.i++;
    d.t0 = now + 500;
    if (d.i >= d.lista.length) { d.fin = true; for (const m of parts.get(d.pid).meshes) { m.material.emissive.copy(HL); m.material.emissiveIntensity = 0.5; } }
    textoDesm();
  }
  invalidate();
}
function salirDesm() {
  if (!desm) return;
  desm = null;
  $('desmbar').hidden = true;
  isolated = null;
  setExplode(explodeT);
  paint();
}
$('desm-fin').addEventListener('click', salirDesm);
$('desm-rep').addEventListener('click', () => { const pid = desm?.pid; salirDesm(); if (pid) desmontar(pid); });
$('pane-ficha').addEventListener('click', (e) => { const b = e.target.closest('[data-desm]'); if (b) desmontar(b.dataset.desm); });

function tituloCirc(c) { const t = c.nombre.replace(/^Diagrama del? circuito del? /, ''); return t[0].toUpperCase() + t.slice(1); }
function circsDe(pid) {
  const cs = Object.entries(CIRCS).filter(([, c]) => (c.piezas || []).includes(pid));
  if (!cs.length) return '';
  return `<h3>Circuitos donde aparece</h3><div class="btn-row">${cs.map(([k]) => `<button class="btn" type="button" data-circ="${k}">${k}</button>`).join('')}</div>`;
}
function renderCircs() {
  $('pane-circ').innerHTML = `<p class="note" style="margin-top:0">Elegí un circuito del capítulo 9A: se resaltan sus piezas (batería, fusibles, sensores, módulos, mazos) y el resto queda transparente.</p>` +
    Object.entries(CIRCS).map(([k, c]) => `<button class="circ" type="button" data-circ="${k}" aria-current="${circActivo === k}"><b>${k}</b>${esc(tituloCirc(c))}</button>`).join('');
}
function verCircuito(k) {
  const c = CIRCS[k];
  if (!c) return;
  if (focus) exitFocus();
  circActivo = k;
  const pz = (c.piezas || []).filter((p) => parts.has(p));
  for (const p of pz) if (!CAPAS.get(parts.get(p).capa)?.visible) capaVisible(parts.get(p).capa, true);
  if (!CAPAS.get('electrico').visible) capaVisible('electrico', true);
  isolated = new Set(pz);
  selected = null;
  paint();
  if (pz.length) {
    const box = new THREE.Box3();
    for (const p of pz) box.expandByObject(parts.get(p).obj);
    const ctr = box.getCenter(new THREE.Vector3());
    const r = Math.max(0.4, box.getSize(new THREE.Vector3()).length() * 0.55);
    const dir = camera.position.clone().sub(controls.target).normalize();
    flyTo(ctr, ctr.clone().addScaledVector(dir, r / Math.sin((camera.fov * Math.PI) / 360)), true, { x: 0, y: 0 });
  }
  const url = SITIO + 'Manual-de-taller/Circuitos/' + encodeURIComponent(c.nota.replace(/ /g, '-'));
  $('pane-ficha').innerHTML = `<span class="chip"><span class="dot" style="background:var(--accent)"></span>Circuito ${esc(k)}</span>
    <h2 class="name">${esc(tituloCirc(c))}</h2>
    <div class="circ-actions"><button class="btn" type="button" data-act="salir-circ">Salir del circuito</button>
      <a class="btn" href="${url}" target="_blank" rel="noopener">Ver la nota con el esquema</a></div>
    ${c.explicacion ? `<p>${esc(c.explicacion)}</p>` : ''}
    <h3>Piezas del circuito</h3><div class="list">${pz.map((p) => `<button class="row" type="button" data-pid="${p}">${esc(parts.get(p).nombre)}</button>`).join('') || '<p class="note">Todavía cargando…</p>'}</div>
    <p class="note">Página ${c.pagina} del manual de taller (diagrama original).</p>`;
  showTab('ficha');
  renderCircs();
}
function salirCircuito() { circActivo = null; isolated = null; paint(); renderOverview(); renderCircs(); }
$('pane-circ').addEventListener('click', (e) => { const b = e.target.closest('[data-circ]'); if (b) verCircuito(b.dataset.circ); });
$('pane-ficha').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.circ) verCircuito(b.dataset.circ);
  else if (b.dataset.act === 'salir-circ') salirCircuito();
});

// ---------------------------------------------------------------- bucle
renderer.setAnimationLoop((now) => {
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.dur);
    setExplode(anim.from + (anim.to - anim.from) * k);
    if (k >= 1) anim = null;
  }
  if (fly) {
    const k = ease(Math.min(1, (now - fly.t0) / fly.dur));
    controls.target.lerpVectors(fly.ft, fly.tt, k);
    camera.position.lerpVectors(fly.fp, fly.tp, k);
    vo = { x: fly.fo.x + (fly.to.x - fly.fo.x) * k, y: fly.fo.y + (fly.to.y - fly.fo.y) * k };
    applyViewOffset();
    if (k >= 1) fly = null;
  }
  controls.update();
  tickShow(now);
  tickDesm(now);
  if (dirty || anim || fly || (focus && focus.show) || (desm && !desm.fin)) {
    dirty = false;
    renderer.render(scene, camera);
    cuadros++;
  }
  hudTick(now);
});
</script>
